#
# EL CORTE VA AL REVÉS QUE LA INTUICIÓN: lo anormal es colapsar POCO. Un índice
# por debajo del 50% indica sobrecarga; por encima, la hace menos probable. Por
# eso `direccion: bajo` y `corte_inferior`, y por eso el término nombra la
# colapsabilidad REDUCIDA y no la medida a secas.

