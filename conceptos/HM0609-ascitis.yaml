# Concepto del índice. Sembrado desde el vocabulario semilla de holonmed.
# Los códigos HM: son permanentes: no se renumeran ni se reutilizan.

id: 'HM:0609'
tipo: concepto
semantica: hallazgo
termino: Ascitis
termino_en: Ascites
sinonimos:
  - líquido libre peritoneal
  - derrame peritoneal
  - ascitis clínica
padre: 'HM:0600'
codigos:
  snomed: null
  icd10: null
  hpo: null

significante: >-
  Distensión abdominal difusa con matidez dependiente a la percusión (matidez en flancos HM:3180,
  matidez cambiante HM:3179) o presencia de onda líquida palpable (HM:3178).
significado: >-
  Acumulación patológica de líquido libre en la cavidad peritoneal.
falsos_positivos:
  - Obesidad abdominal masiva o panículo adiposo grueso
  - Quiste intraabdominal o retroperitoneal gigante
  - Globo vesical masivo o hidronefrosis gigante

contrasta_con:
  - 'HM:0902'
  - 'HM:3178'
  - 'HM:3179'

procedencia:
  fuente: vocabulario_semilla holonmed v1.3.0
  nota: >-
    Relicenciado a CC0 por el autor para su uso como índice compartido.
    El original se distribuye bajo AGPL-3.0-or-later dentro de holonmed.
    Tríada completada al modelar la condición HM:6046.
