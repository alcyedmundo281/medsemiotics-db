# Concepto del índice. Acuñado al modelar HM:6003 (mononucleosis infecciosa).
# El umbral no es único: el cociente cambia con el porcentaje, así que las
# aristas lo declaran por tramos en lugar de fijar un corte aquí.

id: 'HM:3004'
tipo: concepto
semantica: hallazgo
termino: Linfocitosis atípica
sinonimos:
  - linfocitos atípicos
  - células de Downey
padre: 'HM:0710'
codigos:
  snomed: null
  icd10: null
  hpo: null

significante: >-
  Linfocitos de tamaño aumentado, con citoplasma abundante y núcleo irregular (células
  de Downey), en el frotis de sangre periférica. Se expresa como porcentaje de los
  leucocitos; en la valoración inicial se busca más de un 10 % de atípicos
  (pmid:36689975).
significado: >-
  Expansión extraordinaria de linfocitos T CD8+ dirigidos contra los linfocitos B
  infectados por el virus de Epstein-Barr durante la infección aguda (pmid:25774295).
falsos_positivos:
  - Linfocitos reactivos de otras infecciones virales, como citomegalovirus
  - Linfocitos atípicos en reacciones a fármacos
  - Células de una neoplasia linfoide confundidas con linfocitos reactivos

medios:
  - tipo: imagen
    id: "wikimedia:Atypical_lymphocytes_2.jpg"
    descripcion: >-
      Frotis de sangre periférica con linfocitos atípicos (células de Downey)
    credito: Dr Erhabor Osaro
    fuente: Wikimedia Commons
    fuente_url: "https://commons.wikimedia.org/wiki/File:Atypical_lymphocytes_2.jpg"
    licencia_img: CC BY-SA 3.0
    licencia_url: "https://creativecommons.org/licenses/by-sa/3.0/"
    archivo_local: "assets/img/linfocitosis-atipica.jpg"

procedencia:
  fuente: >-
    Acuñado al modelar la mononucleosis infecciosa. Tríada completada al revisar la condición HM:6003,
    sostenida sobre pmid:36689975 (Sylvester 2023) y pmid:25774295 (Balfour 2015).
