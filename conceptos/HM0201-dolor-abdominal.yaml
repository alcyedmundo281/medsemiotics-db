# Concepto del índice. Sembrado desde el vocabulario semilla de holonmed.
# Los códigos HM: son permanentes: no se renumeran ni se reutilizan.

id: 'HM:0201'
tipo: concepto
semantica: hallazgo
termino: Dolor abdominal
sinonimos:
  - dolor en abdomen
  - abdominalgia
padre: 'HM:0200'
codigos:
  snomed: null
  icd10: null
  hpo: null

significante: >-
  Dolor referido por el paciente en el abdomen. Se caracteriza por su localización
  (cuadrante o región), carácter, cronología, irradiación y los factores que lo
  modifican; la localización es el punto de partida de la evaluación (pmid:18441863).
significado: >-
  Estímulo nociceptivo de origen visceral (distensión, inflamación o isquemia de una
  víscera, mal localizado y de línea media), parietal (irritación del peritoneo,
  bien localizado) o referido desde estructuras extraabdominales (pmid:23055768).
  En los trastornos funcionales intestinales se asocia a la defecación o a cambios
  del hábito intestinal (pmid:27144627).
falsos_positivos:
  - Dolor de pared abdominal (musculoesquelético o neuropático), que no procede de las vísceras
  - Dolor referido desde el tórax, como el de origen cardiaco o pleural

procedencia:
  fuente: >-
