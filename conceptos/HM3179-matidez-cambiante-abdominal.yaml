# Concepto del índice. Acuñado al modelar HM:6046 (ascitis).
# Los códigos HM: son permanentes: no se renumeran ni se reutilizan.

id: 'HM:3179'
tipo: concepto
semantica: hallazgo
termino: Matidez cambiante abdominal
termino_en: Shifting dullness
sinonimos:
  - matidez desplazable abdominal
  - signo de la matidez cambiante
  - shifting dullness
padre: 'HM:0600'
codigos:
  snomed: null
  icd10: null
  hpo: null

significante: >-
  Línea de transición entre el timpanismo central periumbilical y la matidez en los flancos
  en decúbito supino, que al rotar al paciente a decúbito lateral se desplaza por gravedad hacia
  el lado dependiente, volviéndose timpánico el flanco sobreelevado.
significado: >-
  Desplazamiento gravitacional dependiente de líquido libre intraperitoneal en la cavidad
  peritoneal al cambiar de postura, haciendo flotar las asas intestinales con gas.
falsos_positivos:
  - Vejiga urinaria distendida o contenido colónico abundante fluido
  - Ascitis tabicada (falso negativo por ausencia de desplazamiento libre)

procedencia:
  fuente: 'JAMA Rational Clinical Examination (pmid:1573754)'
  nota: 'Sintetizado para el índice a partir de la revisión de Williams & Simel 1992.'
