# Concepto del índice. Acuñado en la OLEADA 1 al migrar biosemiotics.
#
# NO ES HM:3155. Aquel es tener líquido pericárdico; éste es que ese líquido
# impida el llenado. La fuente separa las dos cosas expresamente, y confundirlas
# es el error que el propio significado advierte.
#
# SIN `umbral`, y su origen explica por qué con números: el colapso del
# ventrículo derecho da sensibilidades entre el 48 % y el 100 % y
# especificidades entre el 72 % y el 100 % según la serie; el de la aurícula
# derecha, entre el 50 % y el 100 % y entre el 33 % y el 100 %. Son rangos entre
# estudios, no un corte, y la fuente advierte que solo son fiables cuando la
# probabilidad previa ya es alta. Como en HM:3162, ese rendimiento pertenece a
# una arista contra una condición que aún no existe.

id: 'HM:3163'
tipo: concepto
semantica: hallazgo
termino: Taponamiento cardíaco en ecografía
termino_en: Cardiac tamponade on ultrasound
sinonimos:
  - fisiología de taponamiento
  - colapso diastólico del ventrículo derecho
padre: 'HM:0900'
codigos: {snomed: null, icd10: null, hpo: null}

significante: >-
  Derrame pericárdico con colapso diastólico del ventrículo derecho,
  colapso sistólico de la aurícula derecha, vena cava inferior dilatada
  (pletórica) sin colapso inspiratorio y, en derrames grandes, corazón
  oscilante (swinging heart).
significado: >-
  Presión intrapericárdica elevada que restringe el llenado de las
  cavidades derechas: fisiología de taponamiento, distinta de solo tener
  líquido pericárdico.
falsos_positivos:
  - Colapso de cavidades derechas por hipovolemia grave —el 'síndrome
    del corazón vacío'—, sin taponamiento real
  - >-
      Hipertensión pulmonar o hipertrofia del ventrículo derecho:
      retrasan o enmascaran el colapso (falso negativo, no una
      tranquilidad)
  - >-
      Derrame loculado o coágulo posquirúrgico que comprime una sola
      cámara: no produce el patrón circunferencial clásico
  - >-
      Coágulo o hematoma pericárdico posquirúrgico ecogénico: puede
      parecer tejido sólido y pasar inadvertido por vía transtorácica
      —otro falso negativo, distinto al del punto anterior
  - Vena cava inferior dilatada por falla derecha o ventilación con
    presión positiva, sin taponamiento
  - Ventana única, mala calidad de imagen o taquicardia extrema que
    dificulta juzgar el momento del ciclo cardíaco

contrasta_con: ['HM:3155', 'HM:3162']

procedencia:
  fuente: >-
    Tríada migrada en la oleada 1 desde biosemiotics (signo-taponamiento-
    cardiaco), que la sostiene sobre 7 referencias, todas ya presentes en
    el índice.
  nota: >-
    Los seis falsos positivos son los de la fuente, literales.
    `se_basa_en` no se migró: apuntaba a los conceptos de física y
    artefactos de ecografía, que se quedan en biosemiotics por decisión de
    la oleada 1. Una relación sin destino resoluble se publicaría como un
    identificador roto.
