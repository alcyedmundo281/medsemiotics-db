# Concepto del índice. Acuñado al modelar HM:6039 (estrés postraumático).
#
# NO DECLARA UMBRAL, y la omisión es deliberada. Sus cocientes salen de la
# corrección de pmid:26241601, que publica la fila entera del eAppendix 5
# —sensibilidad, especificidad, LR+ y LR−— pero NO dice con qué puntuación se
# consideró positivo el cuestionario. El corte vive en el eAppendix, que está
# tras el mismo muro que el resto de la fuente. Escribir aquí el corte habitual
# del instrumento sería adivinarlo, y un corte adivinado convierte un cociente
# medido en un número que no aplica: es exactamente el error que documenta
# HM:3152, donde mover el corte de 15 a 14 cambió el cociente de 1.6-7.6 a 3.4.

