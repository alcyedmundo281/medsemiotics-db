procedencia:
  fuente: >-
    Acuñado al modelar el embarazo ectópico. Es un hallazgo compuesto y se
    acuña como tal porque así se midió: el cociente pertenece a la masa anexial
    VISTA CON EL ÚTERO VACÍO, no a la masa anexial por su cuenta. Separado de
    HM:3065, que es la anomalía anexial sin más y trae otro cociente.
