umbral:
  # SIN `unidad` a propósito, y es el único de los 20 heredados que se queda así.
  # En los demás el valor del corte determina la unidad —38.0 solo es fiebre en
  # °C, 12.0 de hemoglobina solo existe en g/dL—. Aquí no: 10 mg/L es el límite
  # superior de normalidad habitual y 10 mg/dL (= 100 mg/L) es un corte de
  # infección bacteriana también en uso. Las dos lecturas son clínicamente
  # plausibles y se diferencian en un factor de 10, que es exactamente el error
  # que la unidad existe para impedir. Lo resuelve la fuente, no el criterio de
  # quien puebla.
  parametro: Proteína C reactiva
  direccion: alto
  corte_superior: 10
  ref: null   # pendiente: el corte necesita procedencia, y con ella la unidad

