# Concepto del índice. Los códigos HM: son permanentes.
#
# Se acuña porque NO existía equivalente: ni hematoquecia, ni rectorragia, ni
# sangrado rectal. HM:0310 «Melena» es sangre digerida —sangrado alto— y no
# sirve: atribuirle un dato medido sobre sangre roja por vía baja sería una cita
# que resuelve y habla de otro hallazgo.

id: 'HM:3060'
tipo: concepto
semantica: hallazgo
termino: Hematoquecia
termino_en: Hematochezia
sinonimos:
  - rectorragia
  - sangrado rectal
  - sangre en heces
  - sangre en el papel higiénico
  - sangre roja por el recto
padre: 'HM:0300'
codigos: {snomed: null, icd10: null, hpo: null}

significante: null
significado: null
falsos_positivos: []

# Se distingue de HM:0310 (Melena) por el nivel del sangrado. No son variantes
# del mismo hallazgo: la melena indica origen alto y la hematoquecia, bajo.
contrasta_con: ['HM:0310']

procedencia:
  fuente: >-
    Acuñado al curar los signos de alarma del síndrome de intestino irritable.
    Su arista no se emite todavía: ver la nota de discrepancia en HM:6002.
