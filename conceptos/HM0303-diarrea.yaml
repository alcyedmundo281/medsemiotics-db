# Concepto del índice. Sembrado desde el vocabulario semilla de holonmed.
# Los códigos HM: son permanentes: no se renumeran ni se reutilizan.

id: 'HM:0303'
tipo: concepto
semantica: hallazgo
termino: Diarrea
sinonimos:
  - deposiciones líquidas
  - heces blandas frecuentes
padre: 'HM:0300'
codigos:
  snomed: null
  icd10: null
  hpo: null

significante: >-
  Deposiciones de consistencia disminuida, blandas o líquidas, con o sin aumento de su
  frecuencia. La forma de las heces se registra con la escala de Bristol, cuyos tipos 6
  y 7 corresponden a heces blandas o líquidas (pmid:9299672, pmid:27144627).
significado: >-
  Aceleración del tránsito intestinal o alteración de la absorción o la secreción de
  agua y electrolitos; la forma de las heces se correlaciona con el tiempo de tránsito
  intestinal mejor que la frecuencia de las deposiciones (pmid:9299672).
falsos_positivos:
  - Seudodiarrea, con deposiciones frecuentes pero de consistencia normal
  - Incontinencia fecal referida como diarrea
  - Diarrea por rebosamiento alrededor de un fecaloma

procedencia:
  fuente: >-
    vocabulario_semilla holonmed v1.3.0. Tríada completada al revisar la condición HM:6002,
    sostenida sobre pmid:9299672 (Lewis 1997, escala de Bristol) y pmid:27144627
    (Mearin 2016, Roma IV).
  nota: >-
    Relicenciado a CC0 por el autor para su uso como índice compartido.
    El original se distribuye bajo AGPL-3.0-or-later dentro de holonmed.
