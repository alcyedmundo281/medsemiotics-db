# Concepto del índice. Acuñado al modelar HM:6046 (ascitis).
# Los códigos HM: son permanentes: no se renumeran ni se reutilizan.

id: 'HM:3183'
tipo: concepto
semantica: hallazgo
termino: Aumento del perímetro abdominal
termino_en: Increased abdominal girth
sinonimos:
  - distensión abdominal referida
  - aumento de cintura
  - ensanchamiento del abdomen
  - ropa apretada en abdomen
padre: 'HM:0300'
codigos:
  snomed: null
  icd10: null
  hpo: null

significante: >-
  Incremento progresivo objetivado o referido por el paciente de la circunferencia
  abdominal, manifestado típicamente por necesidad de aflojar la ropa o cinturón.
significado: >-
  Ocupación de la cavidad peritoneal o retroperitoneal por líquido libre, gas, grasa o masa visceral.
falsos_positivos:
  - Meteorismo o distensión gaseosa intestinal funcional
  - Aumento de tejido adiposo parietal o visceral
  - Retención urinaria aguda o globo vesical

procedencia:
  fuente: 'JAMA Rational Clinical Examination (pmid:1573754)'
  nota: 'Sintetizado para el índice a partir de la revisión de Williams & Simel 1992.'
