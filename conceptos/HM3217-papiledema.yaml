padre: 'HM:0600'
codigos: {snomed: null, icd10: null, hpo: null}

significante: >-
  Hallazgo oftalmoscópico bilateral caracterizado por tumefacción y elevación de la cabeza
  del nervio óptico (disco óptico o papila), con borramiento nítido de sus bordes (iniciándose
  en los polos nasal y superior/inferior y completándose en el temporal), hiperemia capilar del
  disco, pérdida de la excavación fisiológica central, ausencia del pulso venoso retiniano
  espontáneo en reposo, ingurgitación venosa tortuosa y, en fases avanzadas, hemorragias peripapilares
  en llama, exudados algodonosos y líneas circunferenciales de pliegue retiniano (líneas de Paton).
significado: >-
  Representa el estasis y bloqueo mecánico del flujo axoplasmático anterógrado lento y rápido en los
  axones de las células ganglionares retinianas a nivel de la lámina cribosa, provocado por la
  transmisión de presiones elevadas a través del espacio subaracnoideo perióptico continuo. Es el signo
  físico cardinal de hipertensión intracraneal (inducida por masas tumorales ocupantes de espacio,
  hemorragia subaracnoidea, hidrocefalia obstructiva o hipertensión intracraneal idiopática / pseudotumor
  cerebri).
falsos_positivos:
  - Pseudopapiledema por drusas del nervio óptico (elevación irregular con bordes festoneados y vasos no oscurecidos, visible con autofluorescencia)
  - Papilitis / neuritis óptica anterior aguda (típicamente unilateral, con pérdida visual central severa y defecto pupilar aferente relativo)
  - Hipermetropía alta con discos ópticos pequeños y apiñados fisiológicos (*crowded discs*)

procedencia:
  fuente: Migrado desde datos/temario.csv (Papilledema).
