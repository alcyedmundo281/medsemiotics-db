# Concepto del índice. Sembrado desde el vocabulario semilla de holonmed.
#
# La tríada se rellenó en la OLEADA 1, migrada de biosemiotics
# (signo-colelitiasis).
#
# SIN `umbral`, y la ausencia es el dato. biosemiotics dice expresamente que no
# hay un diámetro único que defina el signo: lo que lo define es la combinación
# de localización intravesicular, movilidad y sombra posterior, y advierte que
# los cálculos pequeños pueden no dar sombra visible. Estructurar un corte aquí
# inventaría una cifra que la fuente niega tener.

id: 'HM:0903'
tipo: concepto
semantica: hallazgo
termino: Litiasis biliar en imagen
termino_en: Cholelithiasis on imaging
sinonimos:
  - colelitiasis
  - cálculo vesicular
  - cálculo biliar en ecografía
padre: 'HM:0900'
codigos: {snomed: null, icd10: null, hpo: null}

significante: >-
  Foco ecogénico intravesicular, móvil o dependiente, con sombra acústica
  posterior.
significado: >-
  Cálculo dentro de la luz de la vesícula biliar.
falsos_positivos:
  - >-
      Pólipo vesicular adherido a la pared: no cambia de posición y
      habitualmente no produce sombra
  - >-
      Barro biliar o barro tumefactivo: ecos de bajo nivel,
      dependientes, sin sombra limpia
  - Pliegue del cuello vesicular o válvula de Heister
  - Gas duodenal o sombra de borde fuera de la luz vesicular
  - Calcificación mural o clip quirúrgico en una anatomía alterada

contrasta_con:
  - 'HM:3175'
  - 'HM:3176'

procedencia:
  fuente: >-
    Tríada migrada en la oleada 1 desde biosemiotics (signo-colelitiasis),
    que la sostiene sobre 3 referencias, todas ya presentes en el índice.
  nota: >-
    Los cinco falsos positivos son los de la fuente, literales.
    `se_basa_en` no se migró —apuntaba a la física de la sombra acústica,
    que se queda en biosemiotics—. Contrasta con el signo de colecistitis aguda
    (HM:3175) y con la dilatación del conducto biliar común / coledocolitiasis (HM:3176).
