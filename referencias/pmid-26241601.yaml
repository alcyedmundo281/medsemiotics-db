    - >-
      Registrada SIN usar. La errata se titula «Value Errors in Tables and Abstract»,
      es decir, afecta justo a la parte de la que se transcribe. Coincide con que su
      abstract dé dos cocientes distintos para el mismo instrumento y umbral:
      LR+ 6.9 y 8.49 para el PC-PTSD.
    - >-
      COTEJO CERRADO el 06/09/2026 contra el cuerpo de la corrección
      (doi 10.1001/jama.2015.16955, jamanetwork fullarticle/2480459). La
      corrección SÍ es de este artículo: su referencia [1] es Spoont 2015, JAMA
      314(5):501-510. Identificada por DOI, no por página.
    - >-
      QUÉ CORRIGE, literal: «had incorrect data in the Abstract, in Table 3, and
      in eAppendix 5. In the Abstract, 2 sentences were removed and some values
      were rounded. The Trauma Screening Questionnaire row of Table 3 has an
      added footnote and the values for the Total Patients, PPV, and NPV columns
      should be 152, 44, and 89, respectively. In eAppendix 5, there is an added
      footnote and the values for sensitivity, specificity, LR+, and LR− columns
      in the Trauma Screening Questionnaire row should be 0.95 (0.90-0.97), 0.26
      (0.22-0.30), 1.3 (1.2-1.4), and 0.20 (0.10-0.41), respectively.»
    - >-
      LO ÚNICO CITABLE ES EL TRAUMA SCREENING QUESTIONNAIRE, y sus cifras las da
      la propia corrección, que es la fuente más autorizada posible: Se 0.95
      (IC95% 0.90-0.97), Sp 0.26 (IC95% 0.22-0.30), LR+ 1.3 (IC95% 1.2-1.4),
      LR− 0.20 (IC95% 0.10-0.41), sobre 152 pacientes, VPP 44 y VPN 89.
    - >-
      `errata_verificada` SE DEJA SIN PONER, aunque el cotejo esté hecho, por la
      misma razón que en pmid:41729549: el campo es por referencia y no por
      cifra, y aquí solo una fila de la fuente está desbloqueada. Ponerlo
      abriría la puerta también a los cocientes del PC-PTSD y del PTSD
      Checklist, que siguen bloqueados. Quien modele el Trauma Screening
      Questionnaire tendrá que ponerlo, y al hacerlo pasará por estas notas,
      que es exactamente lo que se busca. Falla cerrado a propósito.
    - >-
      EL ABSTRACT SIGUE BLOQUEADO. La corrección dice que tenía datos
      incorrectos, que se retiraron dos frases y que se redondearon valores,
      pero NO dice cuáles. La contradicción del PC-PTSD (LR+ 6.9 frente a 8.49)
      y la del PTSD Checklist (5.2 frente a 6.8) quedan EXPLICADAS —eran las
      frases duplicadas— pero no RESUELTAS: el aviso no dice qué bloque
      sobrevivió. La aritmética sigue favoreciendo el segundo y sigue sin
      autorizar nada.
    - >-
      LA PÁGINA 90 DE JAMA 315(1) LLEVA TRES AVISOS DE CORRECCIÓN, cada uno con
      su PMID y su DOI: «Value Errors in Tables and Abstract» (pmid:26746468,
      el nuestro), «Incomplete Dosage Information» (pmid:26746469) y «Incorrect
      Data in Tables and eFigure» (pmid:26746470). Confirma que JAMA agrupa
      varias correcciones por página, que es justo la posibilidad que no se pudo
      descartar al cotejar pmid:28763554. Al buscar una errata hay que
      identificarla por su DOI, no por su página.
    - >-
      EL ABSTRACT QUE SIRVE PUBMED SE CONTRADICE A SÍ MISMO, y encaja con el
      título de la errata. Da dos bloques de cifras para los MISMOS
      instrumentos y los MISMOS cortes: el PC-PTSD de 4 ítems con el corte de la
      VA aparece con LR+ 6.9 (IC95% 5.5-8.8) y LR− 0.30, y también con Se 0.69,
      Sp 0.92, LR+ 8.49 (IC95% 5.56-12.96) y LR− 0.34; el PTSD Checklist de 17
      ítems con corte ~40 aparece con LR+ 5.2 (IC95% 3.6-7.5) y también con Se
      0.70, Sp 0.90 y LR+ 6.8 (IC95% 4.7-9.9).
    - >-
      COMPROBACIÓN ARITMÉTICA, que es una pista y NO una autorización para
      transcribir: LR+ = Se/(1−Sp) da 8.63 para el PC-PTSD y 7.00 para el
      Checklist. El segundo bloque cuadra con su propia Se y Sp (desvíos del 2%
      y 3%); el primero no (20% y 26%). Eso SUGIERE que los valores corregidos
      son los del segundo bloque, pero sugerir no es leer la corrección: quién
      corrige a quién lo dice el aviso, no la aritmética de quien puebla.
    - >-
      QUÉ FALTA PARA EL RESTO: el abstract YA CORREGIDO del propio artículo
      (doi 10.1001/jama.2015.7877). El que sirve PubMed sigue mostrando los dos
      bloques, así que parece ser el anterior a la corrección. Sin él, los
      cocientes del PC-PTSD y del PTSD Checklist no pueden entrar.
