# Registro de referencia del índice. Datos bibliográficos derivados de refs.bib
# de biosemiotics; PMID, título, revista, volumen, páginas y DOI cotejados contra
# PubMed uno por uno.
#
# NO LO GENERÓ scripts/6_referencia_por_pmid.py, y por eso lleva candado. La
# política de egreso de la sesión que lo trajo bloquea eutils.ncbi.nlm.nih.gov y
# api.crossref.org, así que ni ese script ni scripts/8_comprobar_erratas.py
# pudieron correr. El cotejo se hizo contra PubMed por otra vía, que confirma
# título, año, revista, volumen, páginas, DOI y tipo de publicación —así que la
# retractación SÍ está comprobada— pero NO expone «Erratum in:».
#
# QUÉ SIGNIFICA `errata_comprobada: false`. Que nadie ha mirado si este artículo
# tiene errata publicada. No que no la tenga. build.py FALLA si un registro con
# este campo en false sostiene un cociente o un umbral, así que el hueco está
# cerrado por el validador y no por una nota que alguien deba recordar.
#
# CÓMO SE ABRE: corriendo el script donde PubMed sea alcanzable,
#
#     python scripts/6_referencia_por_pmid.py 38825710 robinson2024
#
# que comprueba la errata de verdad y borra este campo al regenerar el registro.

