    - >-
      Registrada SIN usar. Era el candidato más rico de la serie con 12 cocientes,
      y la errata se titula «Incorrect Data in Rational Clinical Examination Article».
    - >-
      COTEJO CERRADO el 06/09/2026, en dos pasos. Primero la corrección (doi
      10.1001/jama.2026.9987, jamanetwork fullarticle/2850814), que confirmó el
      daño sin acotarlo. Después el ABSTRACT YA CORREGIDO del propio artículo
      (doi 10.1001/jama.2026.0446), que es lo que de verdad desbloqueó la
      fuente. Leer el aviso no bastó: hizo falta el artículo.
    - >-
      CÓMO ENTRARON ESTAS CIFRAS, porque no son reproducibles desde aquí y hay
      que decirlo: las pegó el Dr. Torres en la sesión del 06/09/2026 desde la
      página del editor, abierta con su acceso. NINGUNA de las tres vías
      automáticas sirve para comprobarlas: PubMed sigue sirviendo el abstract
      anterior a la corrección, el depósito PMC13320701 del aviso viene vacío, y
      jamanetwork.com no es alcanzable desde el entorno de trabajo. Quien quiera
      verificarlas tiene que abrir doi 10.1001/jama.2026.0446 con acceso propio.
    - >-
      QUÉ CORRIGE, literal: «incorrect values appeared in the abstract, text,
      supplement, and video. Some extracted values were incorrect as well as the
      corresponding summary statistics. In addition, discrepancies reflected
      small rounding differences and the transposition of two data rows between
      primary sources. None of these errors alter the published results or
      conclusions.»
    - >-
      SIETE DE LOS DOCE COCIENTES CAMBIARON. Cotejado uno por uno el abstract
      anterior contra el corregido: intactos solo cinco —la ingurgitación
      yugular (4.1), el edema (2.2), la ausencia de líneas B (0.09) y las dos
      caras de la VCI (3.9 y 0.22)—. Cambian: crepitantes IC95% 1.7-4.5 a
      0.7-4.5 y Sp 81% a 82%; congestión radiográfica 5.9 (2.9-12.0) a 5.8 (2.9-11.5); líneas B
      presentes IC95% 2.6-6.1 a 2.7-6.1; PVY ecográfica 2.8 (2.2-3.5, Sp 71%) a
      2.9 (2.3-3.7, Sp 73%) y su cara negativa 0.26 a 0.27; y el BNP, que es el
      que se lleva casi todo el cambio.
    - >-
      EL BNP ERA LA FILA ROTA, y esto es lo importante del cotejo. LR+ pasa de
      6.9 (IC95% 2.4-20.4, Sp 87%) a 4.2 (IC95% 1.8-10, Sp 78%), y LR− de 0.14
      (Se 87%) a 0.09 (Se 93%). Encaja con lo que la corrección llama «the
      transposition of two data rows between primary sources».
    - >-
      LA ARITMÉTICA ACERTÓ LA FILA Y FALLÓ LA REPARACIÓN, que es exactamente la
      razón por la que no autoriza. Señalaba el BNP —única fila cuya Sp
      declarada (87%) no cuadraba con la derivada (93%)— y acertó. Pero los
      valores que implicaba eran Se 90% y Sp 93%, y los corregidos son Se 93% y
      Sp 78%: haberla «arreglado» con la aritmética habría dejado la
      especificidad MÁS lejos de la verdad que el error original. Detecta que
      una fila está rota; no puede decir cuál de sus cuatro cifras lo está.
    - >-
      CON LAS CIFRAS CORREGIDAS LOS CUATRO HALLAZGOS DE DOBLE CARA CUADRAN
      consigo mismos dentro del 3%: líneas B (Sp declarada 77%, derivada 77.8%),
      VCI (79% y 81.8%), PVY (73% y 74.1%) y BNP (78% y 77.8%). Antes el BNP se
      separaba 6 puntos. Es coherencia recuperada, no prueba de corrección.
    - >-
      «NONE OF THESE ERRORS ALTER THE PUBLISHED RESULTS OR CONCLUSIONS» NO ES UN
      SALVOCONDUCTO. Habla de los resultados y las conclusiones del artículo,
      no de cada cifra: un cociente puede cambiar sin mover la conclusión de que
      el BNP es la mejor prueba aislada. Aquí se transcriben cifras, no
      conclusiones.
    - >-
      LA PISTA DEL BNP GANA SENTIDO, y sigue sin autorizar nada: la corrección
      menciona «the transposition of two data rows between primary sources», que
      es justo el tipo de error que dejaría las cifras de un hallazgo sin cuadrar
      con las suyas propias. Era el hallazgo cuyo desvío se anotó (Se declarada
      87% frente a 90% derivada, Sp 87% frente a 93%). Sirve para saber por
      dónde mirar, no para transcribir.
    - >-
      A FAVOR DEL ENLACE: la corrección se titula «Incorrect Data in Rational
      Clinical Examination Article», que nombra explícitamente la serie de este
      artículo. Es mucho más creíble que el título genérico que despistó en
      pmid:28763554. Aun así no basta: allí el título de PubMed también
      encajaba y el cuerpo corregía otra cosa.
    - >-
      La cita guardada dice «JAMA. 2026 Jun 30», que es la fecha en línea; la
      cita impresa es JAMA 2026;336(9):804, CONFIRMADA en la página del editor.
      El DOI coincide en ambas y es lo que manda.
    - >-
      COMPROBACIÓN CRUZADA, y esta fuente la permite mejor que ninguna otra:
      cuatro hallazgos traen su LR+ y su LR−, así que cada uno predice el dato
      que declara el otro. Líneas B, colapsabilidad de la VCI y presión venosa
      yugular cuadran dentro de 3 puntos. El BNP es el que más se separa:
      sensibilidad declarada 87% frente a 90% derivada, y especificidad
      declarada 87% frente a 93% derivada.
    - >-
      ESE DESVÍO NO ES PRUEBA DE NADA. Los valores son estimaciones agrupadas
      con un modelo logístico mixto de dos niveles, y agrupar cocientes por un
      lado y sensibilidades por otro no tiene por qué dar cifras exactamente
      coherentes. Se anota solo como PISTA de por dónde empezar a leer la
      corrección, y se anota porque coincide con que el BNP es el hallazgo que
      la fuente llama «la mejor prueba aislada» y el que tiene el intervalo más
      ancho de los doce (2.4-20.4).
    - >-
      Doce cocientes en juego, todos del abstract: ingurgitación yugular >3 cm
      LR 4.1 (2.9-5.6, Sp 92%); edema de miembros inferiores LR 2.2 (1.5-3.1, Sp
      80%); crepitantes LR 2.7 (1.7-4.5, Sp 81%); congestión vascular en
      radiografía LR 5.9 (2.9-12.0, Sp 91%); líneas B bilaterales LR 4.0
      (2.6-6.1, Sp 77%) y su ausencia LR 0.09 (0.04-0.23, Se 93%);
      colapsabilidad de VCI <50% LR 3.9 (2.5-6.1, Sp 79%) y ≥50% LR 0.22
      (0.11-0.45, Se 82%); PVY ecográfica >8 cm LR 2.8 (2.2-3.5, Sp 71%) y ≤8 cm
      LR 0.26 (0.20-0.33, Se 81%); BNP ≥100 ng/mL LR 6.9 (2.4-20.4, Sp 87%) y
      normal LR 0.14 (0.08-0.24, Se 87%). Prevalencia 35-69% en 40 estudios y
      11 490 pacientes.
    - >-
      NO FALTA NADA: modelada en HM:6037 con los doce cocientes corregidos. Es
      la fuente más rica del índice.
    - >-
      EL ABSTRACT QUE SIRVE PUBMED SIGUE SIENDO EL ANTERIOR a la corrección: es
      de donde salían las cifras viejas anotadas más arriba. Quien vuelva a esta
      referencia debe leer el artículo en el editor, no el resumen de PubMed.
