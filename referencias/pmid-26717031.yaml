      COTEJO CERRADO el 06/09/2026 contra el cuerpo de la corrección
      (doi 10.1001/jama.2017.5136, jamanetwork fullarticle/2626550). Es de este
      artículo: su referencia [1] es Easter 2015, JAMA 314(24):2672-2681.
    - >-
      QUÉ CORRIGE, y es UNA SOLA COSA: la fila «<15 at 2 h» de la sección GCS de
      la Tabla 1, y la frase correspondiente del apartado Signs de los
      Resultados. Donde decía «GCS score of less than 15 two hours after the
      injury (LR range, 1.6-7.6)» debe leerse «less than 14 two hours after the
      injury (LR, 3.4; 95% CI, 1.4-8.4)».
    - >-
      CAMBIA EL CORTE Y EL COCIENTE A LA VEZ: 15 pasa a 14, y un rango 1.6-7.6
      pasa a ser un valor puntual 3.4 (IC95% 1.4-8.4). Es el caso que justifica
      la regla de no transcribir nunca un cociente sin su umbral: con el corte
      equivocado el número no queda impreciso, queda siendo el de otro hallazgo.
    - >-
      EL ABSTRACT NO ESTÁ AFECTADO. La corrección acota su alcance a la Tabla 1
      y a los Resultados, y ninguna de las ocho cifras del abstract es la
      corregida: el «GCS de 13, LR 4.9» es otra fila, no la del GCS a las dos
      horas. Los cocientes del abstract quedan citables.
    - >-
      DATO NUEVO, que aporta la propia corrección y no estaba en el abstract:
      GCS menor de 14 a las dos horas del traumatismo, LR 3.4 (IC95% 1.4-8.4).
    - >-
      La página 2021 de JAMA 317(19) lleva DOS avisos: «Data Error»
      (pmid:28510658, el nuestro, por su DOI) y «Omission in Text»
      (pmid:28510659). Identificada por DOI, no por página.
    - >-
      EL ABSTRACT NO SE CONTRADICE, al revés que el del TEPT (pmid:26241601), y
      eso NO es tranquilizador: es solo la ausencia de una pista. Sus
      probabilidades postprueba se derivan bien de su propia prevalencia y sus
      propios cocientes —previa 7.1%, LR 0.04 da 0.3048% frente al 0.31%
      declarado; LR 0.08 da 0.6077% frente al 0.61%— y las sensibilidades
      implícitas de LR+ y especificidad son plausibles (16%, 15%, 29%). Un
      bloque de cifras uniformemente erróneo cuadraría consigo mismo igual de
      bien. Que sume no significa que sea correcto.
    - >-
      La errata se publicó en mayo de 2017 para un artículo de diciembre de
      2015: dieciocho meses después. Un desfase así suele significar que el
      error lo encontró alguien releyendo, no el propio equipo en pruebas.
    - >-
      Cifras en juego, todas del abstract: prevalencia de lesión intracraneal
