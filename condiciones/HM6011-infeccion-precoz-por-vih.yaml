# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:25027143 (Wood 2014, JAMA), metaanálisis de 16 estudios con
# 24 745 pacientes y 1253 casos. Transcritos del abstract.
#
# La conclusión importa más que cualquier cociente y va por delante: la utilidad
# de la exploración para detectar o descartar la infección precoz es LIMITADA, y
# eso es precisamente lo que justifica el cribado sistemático. Ningún hallazgo
# baja de 0.5 en negativo; ni siquiera la ausencia de todos ellos descarta.
#
# Se define como los primeros 6 meses tras la infección.

id: 'HM:6011'
tipo: condicion
clase: enfermedad
termino: Infección precoz por VIH
termino_en: Early HIV infection
url: "https://powersemiotics.com/medsemiotics/post.html?slug=infeccion-precoz-por-vih-precision-semiotica"
sinonimos: [primoinfección por VIH]

# Verificados el 2026-09-24. SNOMED CT contra la edición internacional 20250201
# en tx.fhir.org: 1142045004 «Primary human immunodeficiency virus infection»,
# activo y en el módulo central. Se prefiere a 111880001 «Acute HIV infection»,
# que exige inicio agudo y curso breve y deja fuera la fase reciente
# asintomática de los primeros 6 meses. CIE-10 contra el navegador de la OMS
# (versión 2019): no tiene código para la infección precoz. B23.0 «Acute HIV
# infection syndrome» solo cubre el síndrome agudo sintomático; por decisión
# del responsable clínico (2026-09-24) no se declara y el campo queda vacío.
codigos:
  snomed: '1142045004'
  cie10: null

# Por decisión del responsable clínico (2026-09-24), limitada a la población
# de la fuente.
probabilidad_base:
  valor: 0.063
  ic95: [0.021, 0.124]
  poblacion: >-
    hombres que tienen sexo con hombres movilizados para cribado de infección
    aguda y precoz por VIH; metaanálisis de 5 estudios
  nota: >-
    rendimiento del cribado por visita, no por paciente, con heterogeneidad muy
    alta (I² 94.9%). Del 11.1% (IC95% 5.9-17.6) con estrategias dirigidas y del
    1.6% (IC95% 0.8-2.4) con cribado universal. No vale para otras poblaciones
  ref: 'pmid:33000916'
factores_riesgo: []

signos:
  # ─── síntomas referidos por el paciente ─────────────────────────────────────
  - concepto: 'HM:3039'    # Úlceras genitales
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 5.4
      ic95: [2.5, 12]
      ref: 'pmid:25027143'
    decision: el síntoma que más aumenta la probabilidad

  - concepto: 'HM:0803'    # Pérdida de peso
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 4.7
      ic95: [2.1, 7.2]
      ref: 'pmid:25027143'

  - concepto: 'HM:0302'    # Vómitos
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 4.6
      ic95: [2.5, 8.0]
      ref: 'pmid:25027143'

  - concepto: 'HM:3040'    # Adenopatías referidas por el paciente
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 4.6
      ic95: [1.3, 8.0]
      ref: 'pmid:25027143'
    decision: >-
      nótese que el síntoma referido pesa MÁS que el signo hallado en la
      exploración, que tiene LR 3.1

  - concepto: 'HM:0101'    # Fiebre
    rol: prueba_sensible
    estado_lr: medido
    lr_negativo:
      valor: 0.74
      ic95: [0.64, 0.84]
      ref: 'pmid:25027143'
    decision: >-
      su ausencia reduce la probabilidad muy poco; no sirve para descartar

  # ─── signo de exploración ───────────────────────────────────────────────────
  - concepto: 'HM:0607'    # Adenopatías
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 3.1
      ic95: [1.0, 5.2]
      ref: 'pmid:25027143'
    lr_negativo:
      valor: 0.70
      ic95: [0.49, 0.92]
      ref: 'pmid:25027143'
    decision: >-
      el signo exploratorio más útil, y aun así modesto. El extremo inferior de
      su intervalo toca 1.0, es decir, es compatible con no aportar nada.

reglas:
  - nombre: Ausencia de todo hallazgo
    componentes: ['HM:3039', 'HM:0803', 'HM:0302', 'HM:3040', 'HM:0101', 'HM:0607']
    criterio: ninguno de los hallazgos considerados presente
    lr_negativo: 0.47
    ic95: [0.38, 0.58]
    ref: 'pmid:25027143'
    decision: >-
      ni siquiera no encontrar NADA descarta la infección: la probabilidad baja
      a menos de la mitad, no a cero
    nota: >-
      calculado sobre estudios que consideraban combinaciones de 4 a 17
      hallazgos posibles

pendiente:
  - >-
    Probabilidad base fuera de hombres que tienen sexo con hombres. Wood 2014
    reúne 1253 casos entre 24 745 pacientes de 16 estudios, pero no publica una
    prevalencia agrupada en su resumen, y el cociente no se calcula. Falta una
    estimación para la población general adulta que consulta.
  - >-
    Búsqueda en PubMed del 2026-09-24. Consulta «(acute HIV[Title] OR early
    HIV[Title] OR primary HIV[Title] OR acute retroviral syndrome[Title]) AND
    (symptoms OR signs OR clinical presentation) AND (systematic review OR
    meta-analysis)», desde 2014-06: 2 resultados, Wood 2014 y Palmer 2020.
    Palmer 2020 evalúa escalas de riesgo y síntomas por su área bajo la curva
    (0.51-0.88 en validación), sin cocientes por hallazgo. Ninguna revisión
    posterior actualiza los cocientes de Wood 2014.
  - >-
    Factores de riesgo. Palmer 2020 enumera las variables de las escalas de
    riesgo (edad, número de parejas sexuales, coito anal receptivo sin
    preservativo, pareja con VIH, otra infección de transmisión sexual, drogas
    ilícitas), pero su resumen no da OR ni RR. Falta una fuente con grupo
    control que los cuantifique.

conclusion_de_la_fuente: >-
  La utilidad limitada de la exploración clínica para detectar o descartar la
  infección precoz por VIH subraya la importancia del cribado sistemático en
  adultos.

procedencia:
  fuente: >-
    Acuñada al poblar aristas con cociente verificado. Valores del abstract de
    pmid:25027143, no del texto completo.
