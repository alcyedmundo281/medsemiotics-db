# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:7861577 (Siminoski K. «The rational clinical examination.
# Does this patient have a goiter?». JAMA. 1995;273(10):813-7). Revisión
# sistemática sobre la precisión de la inspección y palpación tiroidea frente a
# ecografía como estándar de referencia.

id: 'HM:6048'
tipo: condicion
clase: sindrome
termino: Bocio
termino_en: Goiter
url: "https://powersemiotics.com/medsemiotics/post.html?slug=bocio-inspeccion-palpacion-precision"
sinonimos:
  - tiromegalia
  - agrandamiento tiroideo
  - hipertrofia de la glándula tiroides
  - bocio tiroideo

codigos:
  snomed: '3716002'
  cie10: 'E04.9'

probabilidad_base: null
# Por decisión del responsable clínico (2026-09-24): deficiencia de yodo, sexo
# femenino y antecedentes familiares se retiraron (ver pendiente), y se
# añadieron la edad avanzada y el tabaquismo actual de pmid:16235152.
factores_riesgo:
  - factor: Gestación o periodo puerperal
    ref: 'pmid:8320430'
    nota: >-
      en Bruselas, con aporte de yodo en el límite bajo, cerca del 10% de las
      gestantes tenía bocio en el parto, solo en parte reversible en el
      posparto. Sin grupo de no gestantes, así que es un riesgo absoluto en
      una zona con poco yodo
  - factor: Edad avanzada
    ref: 'pmid:16235152'
    nota: >-
      asociación independiente con el bocio ecográfico en varones y en
      mujeres; el resumen no da su OR. SHIP, 3915 adultos de 20 a 79 años de
      una región antes deficiente en yodo
  - factor: Tabaquismo actual
    ref: 'pmid:16235152'
    nota: >-
      asociación independiente y, según la fuente, fuerte en varones y en
      mujeres; el resumen no da su OR. SHIP, 3915 adultos

signos:
  - concepto: 'HM:3187'    # Agrandamiento tiroideo palpable en posición neutra
    rol: prueba_especifica
    estado_lr: medido
    poblacion: >-
      adultos evaluados mediante inspección y palpación con el cuello en
      posición neutra frente a ecografía tiroidea como estándar de referencia
    ref: 'pmid:7861577'
    lr_positivo:
      valor: 26.3
      ref: 'pmid:7861577'
    lr_negativo:
      valor: 0.40
      ref: 'pmid:7861577'
    decision: >-
      un tiroides netamente visible o palpable con el cuello en posición neutra
      confirma bocio con muy alta probabilidad clínica (LR+ 26.3)
    advertencia: >-
      la ausencia de bocio evidente en posición neutra no descarta bocio
      leve o de localización intratorácica/retroesternal (LR- 0.40)

  - concepto: 'HM:3188'    # Lóbulo tiroideo palpable mayor que la falange distal del pulgar (niños)
    rol: prueba_sensible
    estado_lr: medido
    poblacion: >-
      niños en edad escolar evaluados según el criterio de falange distal
      del pulgar de la OMS frente a ecografía tiroidea
    ref: 'pmid:7861577'
    lr_positivo:
      valor: 3.0
      ic95: [2.5, 3.5]
      ref: 'pmid:7861577'
    lr_negativo:
      valor: 0.30
      ic95: [0.24, 0.37]
      ref: 'pmid:7861577'
    decision: >-
      en cribado pediátrico, un lóbulo que supera la falange distal del pulgar
      triplica la probabilidad de bocio confirmado por ultrasonido

  - concepto: 'HM:3188'    # Lóbulo tiroideo palpable mayor que la falange distal del pulgar (gestantes)
    rol: prueba_sensible
    estado_lr: medido
    poblacion: >-
      mujeres gestantes evaluadas según el criterio de falange distal del
      pulgar de la OMS frente a ecografía tiroidea
    ref: 'pmid:7861577'
    lr_positivo:
      valor: 4.7
      ic95: [3.6, 6.0]
      ref: 'pmid:7861577'
    lr_negativo:
      valor: 0.08
      ic95: [0.02, 0.27]
      ref: 'pmid:7861577'
    decision: >-
      en gestantes, la ausencia de lóbulos tiroideos que superen la falange
      distal descarta bocio con excelente fiabilidad (LR- 0.08)

pendiente:
  - >-
    Factor retirado por ser causa y no factor con grupo control: deficiencia
    crónica de yodo en la dieta. Vanderpump 2011 (pmid:21893493) la da como la
    causa más frecuente de enfermedad tiroidea en el mundo, que lleva al bocio,
    sin medida de riesgo. Si se registra, será como causa.
  - >-
    Factores retirados: sexo femenino y antecedentes familiares de patología
    tiroidea o autoinmune. Búsqueda en PubMed del 2026-09-24. Consulta
    «(goiter[Title] OR goitre[Title] OR thyroid nodules[Title]) AND
    (prevalence[Title] OR risk factors[Title]) AND (population-based OR Study of
    Health in Pomerania OR ultrasound survey) AND (women OR female sex)»: 27
    resultados, cribados por título los 10 primeros. Völzke 2005
    (pmid:16235152; SHIP, 3915 adultos de una región antes deficiente en yodo)
    analiza por separado a varones y mujeres, y solo halla la edad avanzada y
    el tabaquismo actual como factores independientes en ambos sexos, que
    entran como factores; el resumen no da sus OR. Ninguna fuente cuantifica el sexo ni el antecedente
    familiar para el bocio.
