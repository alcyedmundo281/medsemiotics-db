# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:24938565 (Wilcox 2014, JAMA), revisión sistemática de la
# serie Rational Clinical Examination sobre 48 estudios. Transcritos del
# abstract; donde la fuente da un rango entre estudios se guarda el rango.
#
# Población: adultos sometidos a toracocentesis por derrame pleural. Nótese que
# la pregunta no es «¿hay derrame?» sino «¿este derrame es exudado?»: todas las
# aristas son pruebas sobre el líquido ya obtenido, no de exploración física.
#
# EL LR+ DE 250 DEL COLESTEROL PLEURAL DISPARA UN AVISO DE build.py Y ESTÁ BIEN
# QUE LO HAGA. Cotejado contra PubMed el 2026-09-24: el abstract publica «LR
# range, 7.1-250», un rango entre estudios, y la referencia no tiene errata. El
# aviso queda en pie a propósito: un extremo de tres cifras merece que alguien
# lo mire cada vez, y quien lo mire encontrará aquí por qué se aceptó.

id: 'HM:6005'
tipo: condicion
clase: sindrome
termino: Derrame pleural exudativo
termino_en: Exudative pleural effusion
url: "https://powersemiotics.com/medsemiotics/post.html?slug=derrame-pleural-exudado-criterios-light-colesterol"
sinonimos: [exudado pleural, derrame pleural tipo exudado]

# Verificados el 2026-09-23. SNOMED CT contra la edición internacional 20250201
# en tx.fhir.org: 13841000119107 «Exudative pleural effusion», activo y en el
# módulo central. CIE-10 contra el navegador de la OMS (versión 2019): no
# distingue exudado de trasudado, así que se declara J90 «Pleural effusion, not
# elsewhere classified», el más próximo. Cuando el derrame se debe a una
# enfermedad clasificada en otro lugar, la OMS lo codifica como J91.
codigos:
  snomed: '13841000119107'
  cie10: 'J90'

probabilidad_base: null    # pendiente: depende por completo del contexto clínico
factores_riesgo: []

signos:
  - concepto: 'HM:3008'    # Colesterol elevado en líquido pleural
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      rango: [7.1, 250]
      umbral: colesterol pleural > 55 mg/dL
      ref: 'pmid:24938565'
      nota: >-
        rango entre estudios, sin estimación agrupada ni intervalo de confianza
        en el abstract. Se lee como «desplaza mucho», no como un valor
    decision: el indicador aislado más potente para clasificar el derrame

  - concepto: 'HM:3009'    # LDH elevada en líquido pleural
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 18
      ic95: [6.8, 46]
      umbral: LDH pleural > 200 U/L
      ref: 'pmid:24938565'
    decision: confirma exudado con un intervalo estrecho y reproducible

  - concepto: 'HM:3010'    # Cociente colesterol pleural/sérico
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 14
      ic95: [5.5, 38]
      umbral: cociente > 0.3
      ref: 'pmid:24938565'
    decision: alternativa al colesterol absoluto cuando se dispone del sérico

  - concepto: 'HM:3011'    # Criterios de Light
    rol: prueba_sensible
    estado_lr: medido
    lr_negativo:
      valor: 0.04
      ic95: [0.02, 0.11]
      umbral: ausencia de los tres criterios
      ref: 'pmid:24938565'
    decision: >-
      su valor está en el negativo: si no se cumple ninguno de los tres, el
      exudado queda prácticamente descartado

  - concepto: 'HM:3007'    # Derrame pleural
    rol: manifestacion
    estado_lr: no_medible
    motivo: >-
      es la condición previa, no una prueba: sin derrame no hay nada que
      clasificar como exudado o trasudado

pendiente:
  - >-
    Sin probabilidad_base. Búsqueda en PubMed del 2026-09-23 de series de
    toracocentesis consecutivas: Porcel 2014 (pmid:24360987; 3077 pacientes) da
    las causas del derrame pero no la proporción de exudados en su resumen, y
    Wilcox 2014 (pmid:24938565) tampoco. Sumar las causas que suelen dar exudado
    sería inferir la cifra, no transcribirla. Falta leer el texto completo de
    Porcel 2014.
  - >-
    Origen del rango 7.1-250 del colesterol pleural. El abstract de Wilcox 2014
    no dice qué estudios dan cada extremo ni cuántos pacientes tienen. La nota
    anterior lo atribuía a «series pequeñas» sin fuente, y se retiró el
    2026-09-24. Falta leer el texto completo, que no está en PMC.

procedencia:
  fuente: >-
    Acuñada al poblar aristas con cociente verificado. Valores del abstract de
    pmid:24938565, no del texto completo.
