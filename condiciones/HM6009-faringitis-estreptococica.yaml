# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:11147989 (Ebell 2000, JAMA), síntesis de 9 estudios
# prospectivos y ciegos con cultivo faríngeo como patrón de referencia.
# Transcritos del abstract, que no publica intervalos de confianza para estos
# valores: los campos ic95 quedan ausentes en lugar de inventados.
#
# La conclusión pesa más que los números: ningún elemento aislado de la
# anamnesis ni de la exploración basta para confirmar ni descartar. Los
# cocientes que siguen van de 1.9 a 3.4 en positivo y de 0.60 a 0.74 en
# negativo, es decir, todos desplazan poco.

id: 'HM:6009'
tipo: condicion
clase: enfermedad
termino: Faringitis estreptocócica
termino_en: Streptococcal pharyngitis
url: "https://powersemiotics.com/medsemiotics/post.html?slug=faringitis-estreptococica-exudado-criterios-centor"
sinonimos:
  - faringoamigdalitis estreptocócica
  - faringitis por estreptococo del grupo A
  - strep throat

# Verificados el 2026-09-23. SNOMED CT contra la edición internacional 20250201
# en tx.fhir.org: 43878008 «Streptococcal sore throat», activo, que lleva
# «Streptococcal pharyngitis» como sinónimo. CIE-10 contra el navegador de la
# OMS (versión 2019): J02.0 «Streptococcal pharyngitis».
codigos:
  snomed: '43878008'
  cie10: 'J02.0'

probabilidad_base:
  valor: 0.37
  ic95: [0.32, 0.43]
  poblacion: >-
    niños menores de 18 años que consultan por odinofagia; metaanálisis de 29
    estudios
  nota: >-
    solo vale para niños: en los menores de 5 años baja al 24% (IC95% 21-26%).
    En adultos no hay estimación agrupada; ver pendiente
  ref: 'pmid:20696723'
factores_riesgo: []

signos:
  - concepto: 'HM:3026'    # Exudado amigdalino
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 3.4
      ref: 'pmid:11147989'
      nota: la fuente no publica intervalo de confianza en el abstract
    decision: el hallazgo aislado más útil, y aun así insuficiente por sí solo

  - concepto: 'HM:3027'    # Exudado faríngeo
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 2.1
      ref: 'pmid:11147989'
      nota: la fuente no publica intervalo de confianza en el abstract
    decision: apoya menos que el exudado amigdalino, del que se distingue

  - concepto: 'HM:3028'    # Exposición reciente a faringitis estreptocócica
    rol: apoyo
    estado_lr: medido
    lr_positivo:
      valor: 1.9
      ref: 'pmid:11147989'
      nota: exposición en las dos semanas previas; sin intervalo en el abstract
    decision: dato de anamnesis con peso escaso

  - concepto: 'HM:3029'    # Adenopatía cervical anterior dolorosa
    rol: prueba_sensible
    estado_lr: medido
    lr_negativo:
      valor: 0.60
      ref: 'pmid:11147989'
      nota: la fuente no publica intervalo de confianza en el abstract
    decision: >-
      su ausencia es lo que más reduce la probabilidad, y aun así la deja en
      más de la mitad de la previa

  - concepto: 'HM:3030'    # Hipertrofia amigdalina
    rol: prueba_sensible
    estado_lr: medido
    lr_negativo:
      valor: 0.63
      ref: 'pmid:11147989'
      nota: la fuente no publica intervalo de confianza en el abstract
    decision: su ausencia reduce poco la probabilidad

  - concepto: 'HM:0211'    # Odinofagia
    rol: manifestacion
    estado_lr: no_medible
    motivo: >-
      es el motivo de consulta que define la población estudiada, no una prueba
      dentro de ella

# El exudado, tomado como categoría única, tiene su propio cociente negativo.
reglas:
  - nombre: Ausencia de exudado
    componentes: ['HM:3026', 'HM:3027']
    criterio: ausencia de exudado amigdalino o faríngeo
    lr_negativo: 0.74
    ref: 'pmid:11147989'
    decision: >-
      su ausencia apenas modifica la probabilidad; no sirve para descartar

escalas:
  - nombre: Criterios de Centor
    componentes_declarados: >-
      cuatro variables clínicas (1 punto cada una): fiebre referida o medida > 38 °C,
      ausencia de tos, exudado amigdalino o faríngeo y adenopatía cervical anterior
      dolorosa
    graduacion:
      parametro: Puntuación de Centor
      unidad: puntos
      lectura: disjunto
    tramos:
      - rango: 4 puntos (probabilidad alta)
        desde: 4
        hasta: 5
        prevalencia: 0.56
        ref: 'pmid:6763125'
        decision: >-
          la probabilidad ronda el 56%; orienta a realizar prueba rápida o
          tratamiento según protocolo local
      - rango: 3 puntos (probabilidad intermedia-alta)
        desde: 3
        hasta: 4
        prevalencia: 0.32
        ref: 'pmid:6763125'
        decision: probabilidad de 32%; indicación habitual de prueba rápida de antígeno o cultivo
      - rango: 2 puntos (probabilidad intermedia)
        desde: 2
        hasta: 3
        prevalencia: 0.15
        ref: 'pmid:6763125'
        decision: probabilidad de 15%; orienta a prueba diagnóstica rápida antes de tratar
      - rango: 1 punto (probabilidad baja)
        desde: 1
        hasta: 2
        prevalencia: 0.065
        ref: 'pmid:6763125'
        decision: probabilidad muy baja (6.5%); generalmente no requiere prueba ni antibiótico
      - rango: 0 puntos (probabilidad mínima)
        desde: 0
        hasta: 1
        prevalencia: 0.025
        ref: 'pmid:6763125'
        decision: descarta prácticamente la etiología estreptocócica (2.5%); no tratar ni cultivar

  - nombre: Escala de McIsaac (Centor modificada)
    componentes_declarados: >-
      criterios de Centor con ajuste por edad: fiebre > 38 °C (+1), ausencia de tos
      (+1), exudado o hipertrofia amigdalina (+1), adenopatía cervical anterior dolorosa
      (+1); edad 3 a 14 años (+1), edad 15 a 44 años (0), edad ≥ 45 años (-1)
    graduacion:
      parametro: Puntuación de McIsaac
      unidad: puntos
      lectura: disjunto
    tramos:
      - rango: 4 a 5 puntos (riesgo alto)
        desde: 4
        hasta: 6
        prevalencia_rango: [0.51, 0.53]
        ref: 'pmid:9475915'
        decision: >-
          riesgo alto (51-53%); indicación de prueba rápida o tratamiento empírico
          según guías locales
      - rango: 3 puntos (riesgo intermedio-alto)
        desde: 3
        hasta: 4
        prevalencia_rango: [0.28, 0.35]
        ref: 'pmid:9475915'
        decision: riesgo del 28-35%; indicación de prueba diagnóstica rápida o cultivo
      - rango: 2 puntos (riesgo intermedio)
        desde: 2
        hasta: 3
        prevalencia_rango: [0.11, 0.17]
        ref: 'pmid:9475915'
        decision: riesgo del 11-17%; indicación de prueba diagnóstica rápida o cultivo
      - rango: 1 punto (riesgo bajo)
        desde: 1
        hasta: 2
        prevalencia_rango: [0.05, 0.10]
        ref: 'pmid:9475915'
        decision: riesgo del 5-10%; no requiere pruebas adicionales ni antibióticos
      - rango: 0 o menor (riesgo mínimo)
        hasta: 1
        prevalencia_rango: [0.01, 0.025]
        ref: 'pmid:9475915'
        decision: riesgo mínimo (1-2.5%); manejo sintomático exclusivo sin antibióticos

conclusion_de_la_fuente: >-
  Ningún elemento aislado de la anamnesis o de la exploración física es lo
  bastante preciso para excluir ni para diagnosticar la faringitis
  estreptocócica. Una regla de predicción clínica bien validada sí resulta útil
  y ayuda al médico a usar de forma más informada las pruebas rápidas de
  antígeno y el cultivo faríngeo.

pendiente:
  - >-
    Se incorporaron las escalas canónicas de Centor (pmid:6763125) y McIsaac
    (pmid:9475915). Queda pendiente evaluar la incorporación de la regla de Breese
    para población pediátrica específica si se requiere mayor granularidad.
  - >-
    Probabilidad base en adultos. Aalbers 2011 (pmid:21631919; 21 estudios,
    mayores de 14 años) no da prevalencia agrupada: en sus series oscila entre
    el 4.7% y el 37.6%, y tres de ellas excluían a los pacientes con Centor
    menor de 2, lo que infla el extremo alto. No se transcribe como rango para
    no leerlo como estimación.

procedencia:
  fuente: >-
    Acuñada al poblar aristas con cociente verificado. Valores de signos aislados
    del abstract de pmid:11147989; escalas de Centor (pmid:6763125) y McIsaac
    (pmid:9475915).

