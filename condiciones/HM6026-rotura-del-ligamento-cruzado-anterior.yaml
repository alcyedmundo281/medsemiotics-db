# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:11585485 (Solomon 2001, JAMA Rational Clinical Examination).
# Población: pacientes con traumatismo o dolor de rodilla evaluados para lesión ligamentosa.

id: 'HM:6026'
tipo: condicion
clase: enfermedad
termino: Rotura del ligamento cruzado anterior
termino_en: Anterior cruciate ligament tear
sinonimos:
  - rotura de LCA
  - lesión de LCA
  - inestabilidad anterior de rodilla

codigos: {snomed: null, cie10: null}

signos:
  - concepto: 'HM:3116'    # Prueba de Lachman
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 25.0
      ic95: [2.7, 651.0]
      ref: 'pmid:11585485'
    lr_negativo:
      valor: 0.1
      ic95: [0.0, 0.4]
      ref: 'pmid:11585485'
    decision: la maniobra clínica aislada con mayor exactitud diagnóstica (LR+ 25.0, LR- 0.1)

  - concepto: 'HM:3120'    # Examen compuesto de LCA
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 25.0
      ic95: [2.1, 306.0]
      ref: 'pmid:11585485'
    lr_negativo:
      valor: 0.04
      ic95: [0.01, 0.48]
      ref: 'pmid:11585485'
    decision: la combinación de anamnesis y exploración física global descarta eficazmente la rotura (LR- 0.04)

  - concepto: 'HM:3117'    # Cajón anterior
    rol: apoyo
    estado_lr: medido
    lr_positivo:
      valor: 3.8
      ic95: [0.7, 22.0]
      ref: 'pmid:11585485'
    lr_negativo:
      valor: 0.30
      ic95: [0.05, 1.50]
      ref: 'pmid:11585485'
    decision: menor sensibilidad y especificidad que Lachman por espasmo de isquiotibiales

conclusion_de_la_fuente: >-
  La prueba de Lachman (LR+ 25.0, LR- 0.1) y el examen clínico compuesto de rodilla
  (LR+ 25.0, LR- 0.04) son altamente precisos para diagnosticar o excluir roturas
  del ligamento cruzado anterior.

procedencia:
  fuente: Acuñada en la Oleada 1.5 a partir de la revisión sistemática RCE (pmid:11585485).
