# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:31237649 (Albassam 2019, JAMA), 11 estudios y 4317
# pacientes. Transcritos del abstract.
#
# PARTICULARIDAD de este registro: varios hallazgos tienen un LR POSITIVO menor
# que 1. No es una errata ni un LR negativo mal etiquetado: son hallazgos cuya
# PRESENCIA argumenta en contra del origen cardíaco. Sentir frío antes de
# desmayarse, tener cefalea o no recordar lo previo apuntan a síncope vasovagal,
# no a arritmia. El campo se llama lr_positivo porque mide la presencia del
# hallazgo; que su valor sea 0.16 es el dato clínico, no un error de signo.

id: 'HM:6010'
tipo: condicion
clase: sindrome
termino: Síncope cardíaco
termino_en: Cardiac syncope
url: "https://powersemiotics.com/medsemiotics/post.html?slug=sincope-cardiaco-vs-vasovagal-anamnesis"
sinonimos: [síncope de origen cardíaco, síncope arrítmico]

# Verificados el 2026-09-24. SNOMED CT contra la edición internacional 20250201
# en tx.fhir.org: 788877005 «Cardiac syncope», activo y en el módulo central.
# CIE-10 contra el navegador de la OMS (versión 2019): no tiene código para el
# síncope cardíaco. Se declara R55 «Syncope and collapse», el más próximo, que
# no distingue la causa. La OMS saca de R55 el ataque de Stokes-Adams (I45.9),
# que es solo una de las causas arrítmicas, así que no sirve para toda la
# condición.
codigos:
  snomed: '788877005'
  cie10: 'R55'

# Albassam 2019 no publica prevalencia global en su resumen.
probabilidad_base:
  valor: 0.095
  poblacion: >-
    822 participantes del Framingham Heart Study que refirieron síncope durante
    un seguimiento medio de 17 años (población general, 1971-1998)
  nota: >-
    proporción de síncopes atribuidos a causa cardíaca en la comunidad; el 36.6%
    quedó sin causa identificada. No es la población de urgencias ni de consulta
    especializada en la que se midieron los cocientes; ver pendiente
  ref: 'pmid:12239256'
factores_riesgo: []

signos:
  # ─── aumentan la probabilidad ───────────────────────────────────────────────
  - concepto: 'HM:3032'    # Fibrilación o flutter auricular
    rol: prueba_especifica
    estado_lr: medido
    sensibilidad: 0.13
    ic95_sensibilidad: [0.06, 0.20]
    especificidad: 0.98
    ic95_especificidad: [0.96, 1.00]
    lr_positivo:
      valor: 7.3
      ic95: [2.4, 22]
      ref: 'pmid:31237649'
    decision: el antecedente que más desplaza hacia el origen cardíaco

  - concepto: 'HM:3034'    # Cianosis presenciada durante el episodio
    rol: prueba_especifica
    estado_lr: medido
    sensibilidad: 0.08
    ic95_sensibilidad: [0.02, 0.14]
    especificidad: 0.99
    ic95_especificidad: [0.98, 1.00]
    lr_positivo:
      valor: 6.2
      ic95: [1.6, 24]
      ref: 'pmid:31237649'
    decision: >-
      rarísima pero casi definitiva cuando la hay: especificidad del 99%.
      Depende de que alguien presenciara el episodio.

  - concepto: 'HM:3033'    # Cardiopatía estructural grave conocida
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      rango: [3.3, 4.8]
      ref: 'pmid:31237649'
      nota: rango entre 2 estudios; sensibilidad 0.35-0.51, especificidad 0.84-0.93
    decision: antecedente que apoya con fuerza moderada

  - concepto: 'HM:3031'    # Primer síncope a los 35 años o más
    rol: prueba_sensible
    estado_lr: medido
    sensibilidad: 0.91
    ic95_sensibilidad: [0.85, 0.97]
    especificidad: 0.72
    ic95_especificidad: [0.66, 0.78]
    lr_positivo:
      valor: 3.3
      ic95: [2.6, 4.1]
      ref: 'pmid:31237649'
    lr_negativo:
      valor: 0.13
      ic95: [0.06, 0.25]
      ref: 'pmid:31237649'
      nota: >-
        la fuente lo expresa como el cociente de la edad menor de 35 años, que
        es el negativo de este hallazgo
    decision: >-
      el dato más útil para DESCARTAR: un primer síncope antes de los 35
      prácticamente excluye el origen cardíaco

  # ─── su presencia argumenta EN CONTRA ───────────────────────────────────────
  - concepto: 'HM:3035'    # Cambio de humor o preocupación prodrómica
    rol: apoyo
    estado_lr: medido
    sensibilidad: 0.02
    especificidad: 0.76
    lr_positivo:
      valor: 0.09
      ic95: [0.02, 0.38]
      ref: 'pmid:31237649'
    decision: su presencia aleja del origen cardíaco y orienta a vasovagal

  - concepto: 'HM:3036'    # Sensación de frío previa
    rol: apoyo
    estado_lr: medido
    sensibilidad: 0.02
    especificidad: 0.89
    lr_positivo:
      valor: 0.16
      ic95: [0.06, 0.64]
      ref: 'pmid:31237649'
    decision: pródromo vegetativo; su presencia aleja del origen cardíaco

  - concepto: 'HM:0207'    # Cefalea
    rol: apoyo
    estado_lr: medido
    sensibilidad: 0.03
    especificidad: 0.80
    lr_positivo:
      valor: 0.17
      ic95: [0.06, 0.55]
      ref: 'pmid:31237649'
    decision: su presencia aleja del origen cardíaco

  - concepto: 'HM:3037'    # Cambio de humor tras el síncope
    rol: apoyo
    estado_lr: medido
    sensibilidad: 0.03
    especificidad: 0.83
    lr_positivo:
      valor: 0.21
      ic95: [0.06, 0.65]
      ref: 'pmid:31237649'
    decision: su presencia aleja del origen cardíaco

  - concepto: 'HM:3038'    # Amnesia de la conducta previa
    rol: apoyo
    estado_lr: medido
    sensibilidad: 0.05
    especificidad: 0.82
    lr_positivo:
      valor: 0.25
      ic95: [0.09, 0.69]
      ref: 'pmid:31237649'
    decision: su presencia aleja del origen cardíaco

  - concepto: 'HM:0505'    # Síncope
    rol: manifestacion
    estado_lr: no_medible
    motivo: >-
      es el motivo de consulta que define la población estudiada; la pregunta no
      es si hubo síncope sino si fue cardíaco

escalas:
  - nombre: EGSYS
    componentes_declarados: seis variables clínicas, electrocardiograma incluido
    # Un solo tramo declarado: la fuente publica el cociente del tramo bajo y no
    # el del alto. Una puntuación de 4 queda fuera de todos los tramos, que es la
    # respuesta correcta —esta escala, aquí, no sabe leerla— y no una laguna que
    # convenga rellenar.
    graduacion:
      parametro: Puntuación EGSYS
      unidad: puntos
      lectura: disjunto
    tramos:
      - rango: menor de 3
        hasta: 3
        lr_negativo_rango: [0.12, 0.17]
        ref: 'pmid:31237649'
        nota: >-
          rango entre 2 estudios que la validaron de forma prospectiva;
          sensibilidad 0.89-0.91, especificidad 0.69-0.73
    decision: una puntuación menor de 3 es lo que mejor descarta el origen cardíaco

pendiente:
  - >-
    Los biomarcadores cardíacos muestran exactitud prometedora según la fuente,
    pero sus umbrales diagnósticos aún requieren validación. No se registran.
  - >-
    Probabilidad base en urgencias. Toarta 2018 (pmid:29136314; 5010 adultos
    en seis servicios de urgencias) da un 5.4% de síncopes de presunta causa
    cardíaca, pero es la impresión del médico al final de la visita, no un
    diagnóstico contra un patrón de referencia. No se transcribe como
    probabilidad base.
  - >-
    Búsqueda en PubMed del 2026-09-24. Consulta «syncope AND (history OR
    clinical features OR clinical examination) AND (cardiac OR arrhythmic) AND
    (diagnostic accuracy OR likelihood ratio)», filtrada a revisiones
    sistemáticas y metaanálisis desde 2019-06: 16 resultados, cribados por
    título y resumen. Ninguno actualiza la exactitud de la anamnesis para el
    síncope cardíaco. Sweanor 2021 (pmid:33382159) evalúa escalas
    multivariables, pero contra eventos adversos a 30 días, no contra el origen
    cardíaco.
  - >-
    Factores de riesgo. Búsqueda en PubMed del 2026-09-24. Consulta «cardiac
    syncope[Title/Abstract] AND (risk factor OR predictors)»: 97 resultados,
    cribados por título los 20 primeros. No aparece ninguna fuente con grupo
    control que dé OR o RR de síncope cardíaco. Lo que Albassam 2019 cuantifica
    como cociente (edad, fibrilación auricular, cardiopatía estructural) ya
    está en las aristas.

conclusion_de_la_fuente: >-
  La exploración clínica, con el electrocardiograma dentro de puntuaciones
  multivariable, puede identificar con precisión a los pacientes con y sin
  síncope cardíaco.

procedencia:
  fuente: >-
    Acuñada al poblar aristas con cociente verificado. Valores del abstract de
    pmid:31237649, no del texto completo.
