# Condición del índice. Los códigos HM: son permanentes.
#
# Acuñada en la OLEADA 1 al modelar la condición correspondiente al signo de
# sobrecarga aguda del ventrículo derecho de biosemiotics (HM:3162). Cocientes
# de ecocardiografía transtorácica de Fields 2017 (pmid:28495379, J Am Soc Echocardiogr).
# Cociente negativo del dímero D de Wells 2006 (pmid:16403932).

id: 'HM:6044'
tipo: condicion
clase: enfermedad
termino: Tromboembolia pulmonar
termino_en: Pulmonary embolism
sinonimos:
  - embolia pulmonar
  - TEP
  - tromboembolismo pulmonar

codigos:
  snomed: '59282003'
  cie10: 'I26.9'

probabilidad_base: null
factores_riesgo:
  - trombosis venosa profunda previa o concomitante
  - inmovilización prolongada o reposo en cama
  - cirugía ortopédica o abdominopélvica reciente
  - neoplasia maligna activa
  - terapia con estrógenos o anticonceptivos orales

signos:
  - concepto: 'HM:3162'    # Ventrículo derecho dilatado en ecografía
    rol: imagen
    estado_lr: medido
    poblacion: >-
      pacientes con sospecha clínica de embolia pulmonar evaluados mediante
      ecocardiografía transtorácica a pie de cama; metaanálisis de estudios de
      exactitud diagnóstica (Fields 2017)
    ref: 'pmid:28495379'
    sensibilidad: 0.53
    ic95_sensibilidad: [0.45, 0.61]
    especificidad: 0.83
    ic95_especificidad: [0.74, 0.90]
    lr_positivo:
      valor: 3.12
      ic95: [1.96, 4.97]
      ref: 'pmid:28495379'
    lr_negativo:
      valor: 0.57
      ic95: [0.47, 0.68]
      ref: 'pmid:28495379'
    decision: >-
      en el paciente inestable hemodinámicamente (shock o hipotensión arterial),
      el hallazgo inequívoco de sobrecarga del VD (relación VD/VI ≥ 1, aplanamiento
      septal o McConnell) apoya fuertemente la embolia pulmonar masiva y justifica
      considerar tratamiento de reperfusión de emergencia si la angio-TC es inviable
    advertencia: >-
      sensibilidad limitada (53%, LR− 0.57); un ventrículo derecho de tamaño y
      función normales NO descarta TEP submasiva o de bajo riesgo hemodinámico

  - concepto: 'HM:3144'    # Dímero D elevado
    rol: prueba_sensible
    estado_lr: medido
    ref: 'pmid:16403932'
    lr_negativo:
      valor: 0.10
      ref: 'pmid:16403932'
    poblacion: >-
      pacientes con sospecha de TEP y baja o intermedia probabilidad clínica pretest
    decision: >-
      un valor de dímero D por debajo del umbral de corte ajustado por edad descarta
      el diagnóstico sin necesidad de angiografía por tomografía

  - concepto: 'HM:0401'    # Disnea
    rol: manifestacion
    estado_lr: no_medido

  - concepto: 'HM:0104'    # Taquicardia
    rol: manifestacion
    estado_lr: no_medido

  - concepto: 'HM:3133'    # Dolor torácico pleurítico
    rol: manifestacion
    estado_lr: no_medido

  - concepto: 'HM:0110'    # Hipoxemia
    rol: apoyo
    estado_lr: no_medido

conclusion_de_la_fuente: >-
  La ecocardiografía a pie de cama muestra especificidad útil y sensibilidad baja
  (53%) para la sospecha de TEP; su mayor utilidad reside en guiar el manejo
  inmediato del paciente en shock o con contraindicación para tomografía.

procedencia:
  fuente: >-
    Acuñada en la oleada 1 para incorporar el rendimiento diagnóstico de la
    sobrecarga aguda del VD (HM:3162) migrado de biosemiotics. Cocientes de
    Fields 2017 (pmid:28495379).

url: "https://powersemiotics.com/medsemiotics/post.html?slug=tromboembolia-pulmonar-precision-semiotica"
