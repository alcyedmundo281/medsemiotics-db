# Condición del índice. Los códigos HM: son permanentes.
#
# Acuñada en la OLEADA 1 al modelar la condición correspondiente al signo de
# sobrecarga aguda del ventrículo derecho de biosemiotics (HM:3162). Cocientes
# de ecocardiografía transtorácica de Fields 2017 (pmid:28495379, J Am Soc Echocardiogr).
# Cociente negativo del dímero D de Wells 2006 (pmid:16403932).

id: 'HM:6044'
tipo: condicion
clase: enfermedad
termino: Tromboembolia pulmonar
termino_en: Pulmonary embolism
sinonimos:
  - embolia pulmonar
  - TEP
  - tromboembolismo pulmonar

codigos:
  snomed: '59282003'
  cie10: 'I26.9'

probabilidad_base: null
# Todas las fuentes miden la enfermedad tromboembólica venosa (trombosis venosa
# profunda o tromboembolia pulmonar), no la tromboembolia pulmonar aislada.
# «Terapia con estrógenos o anticonceptivos orales» se separó el 2026-09-24 en
# dos factores, uno por fuente.
factores_riesgo:
  - factor: Trombosis venosa profunda previa o concomitante
    ref: 'pmid:31340984'
    nota: >-
      tras suspender la anticoagulación de una primera enfermedad
      tromboembólica no provocada, la recurrencia es de 10.3 por 100
      personas-año el primer año (IC95% 8.6-12.1) y la incidencia acumulada del
      36% a los 10 años (IC95% 28-45). Metaanálisis de 18 estudios con 7515
      pacientes; sin grupo sin antecedente, así que es un riesgo absoluto. La
      fuente no trata la trombosis concomitante
  - factor: Inmovilización prolongada o reposo en cama
    ref: 'pmid:10737280'
    nota: >-
      la fuente mide el ingreso hospitalario o en residencia, OR 8.0 (IC95%
      4.5-14.2), independiente de los demás factores. Casos y controles
      poblacional anidado de Olmsted County, 625 casos y 625 controles
  - factor: Cirugía ortopédica o abdominopélvica reciente
    ref: 'pmid:10737280'
    nota: >-
      cirugía en general, OR 21.7 (IC95% 9.4-49.9); el resumen no la desglosa
      por tipo. Traumatismo, OR 12.7 (IC95% 4.1-39.7)
  - factor: Neoplasia maligna activa
    ref: 'pmid:10737280'
    nota: >-
      OR 4.1 (IC95% 1.9-8.5) sin quimioterapia y 6.5 (IC95% 2.1-20.2) con ella
  - factor: Anticonceptivos orales
    ref: 'pmid:19679614'
    nota: >-
      OR 5.0 (IC95% 4.2-5.8) frente a no usarlos; de 3.6 con levonorgestrel a
      7.3 con desogestrel. Casos y controles MEGA: mujeres premenopáusicas
      menores de 50 años, 1524 casos y 1760 controles
  - factor: Terapia hormonal de la menopausia
    ref: 'pmid:38263123'
    nota: >-
      RR 1.86 (IC95% 1.39-2.50) frente a placebo o ningún tratamiento, sin
      diferencia entre estrógeno solo y combinado con progestágeno.
      Metaanálisis de 33 ensayos con 44 639 posmenopáusicas

signos:
  - concepto: 'HM:3162'    # Ventrículo derecho dilatado en ecografía
    rol: imagen
    estado_lr: medido
    poblacion: >-
      pacientes con sospecha clínica de embolia pulmonar evaluados mediante
      ecocardiografía transtorácica a pie de cama; metaanálisis de estudios de
      exactitud diagnóstica (Fields 2017)
    ref: 'pmid:28495379'
    sensibilidad: 0.53
    ic95_sensibilidad: [0.45, 0.61]
    especificidad: 0.83
    ic95_especificidad: [0.74, 0.90]
    lr_positivo:
      valor: 3.12
      ic95: [1.96, 4.97]
      ref: 'pmid:28495379'
    lr_negativo:
      valor: 0.57
      ic95: [0.47, 0.68]
      ref: 'pmid:28495379'
    decision: >-
      en el paciente inestable hemodinámicamente (shock o hipotensión arterial),
      el hallazgo inequívoco de sobrecarga del VD (relación VD/VI ≥ 1, aplanamiento
      septal o McConnell) apoya fuertemente la embolia pulmonar masiva y justifica
      considerar tratamiento de reperfusión de emergencia si la angio-TC es inviable
    advertencia: >-
      sensibilidad limitada (53%, LR− 0.57); un ventrículo derecho de tamaño y
      función normales NO descarta TEP submasiva o de bajo riesgo hemodinámico

  - concepto: 'HM:3144'    # Dímero D elevado
    rol: prueba_sensible
    estado_lr: medido
    ref: 'pmid:16403932'
    lr_negativo:
      valor: 0.10
      ref: 'pmid:16403932'
    poblacion: >-
      pacientes con sospecha de TEP y baja o intermedia probabilidad clínica pretest
    decision: >-
      un valor de dímero D por debajo del umbral de corte ajustado por edad descarta
      el diagnóstico sin necesidad de angiografía por tomografía

  - concepto: 'HM:0401'    # Disnea
    rol: manifestacion
    estado_lr: no_medido

  - concepto: 'HM:0104'    # Taquicardia
    rol: manifestacion
    estado_lr: no_medido

  - concepto: 'HM:3133'    # Dolor torácico pleurítico
    rol: manifestacion
    estado_lr: no_medido

  - concepto: 'HM:0110'    # Hipoxemia
    rol: apoyo
    estado_lr: no_medido

conclusion_de_la_fuente: >-
  La ecocardiografía a pie de cama muestra especificidad útil y sensibilidad baja
  (53%) para la sospecha de TEP; su mayor utilidad reside en guiar el manejo
  inmediato del paciente en shock o con contraindicación para tomografía.

procedencia:
  fuente: >-
    Acuñada en la oleada 1 para incorporar el rendimiento diagnóstico de la
    sobrecarga aguda del VD (HM:3162) migrado de biosemiotics. Cocientes de
    Fields 2017 (pmid:28495379).

url: "https://powersemiotics.com/medsemiotics/post.html?slug=tromboembolia-pulmonar-precision-semiotica"
