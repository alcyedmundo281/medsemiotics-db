# Condición del índice. Los códigos HM: son permanentes.
#
# Cocientes de pmid:23613077 (Crochet 2013, JAMA), 14 estudios con 12 101
# gestantes que consultaron por dolor abdominal o sangrado vaginal en la
# gestación precoz. Transcritos del abstract.
#
# Patrón de referencia doble y poco habitual: visualización quirúrgica directa
# del ectópico, o seguimiento clínico de TODOS los embarazos hasta demostrar que
# no se escapó ninguno. Lo segundo es lo que sostiene el cociente negativo: sin
# seguimiento completo, los ectópicos no operados desaparecen del denominador y
# el LR− sale mejor de lo que es.
#
# LA ANAMNESIS NO DISCRIMINA, y conviene leerlo antes que cualquier cifra:
# «all components of the patient history had a positive likelihood ratio less
# than 1.5». Ni los factores de riesgo clásicos. Lo que decide es la ecografía
# transvaginal, y después la exploración bimanual.
#
# EL LR+ DE 111 DISPARA UN AVISO DE build.py Y ESTÁ BIEN QUE LO HAGA. La cifra
# es la publicada y está verificada contra el abstract, pero su intervalo va de
# 12 a 1028: dos órdenes de magnitud. El aviso queda en pie a propósito, porque
# un cociente de tres cifras merece que alguien lo mire cada vez, y quien lo
# mire encontrará aquí por qué se aceptó.
#
# SEGUNDA FUENTE, AÑADIDA EN LA OLEADA 1: pmid:36063623, el signo del embarazo
# ectópico migrado de biosemiotics. No trae cociente y no podía traerlo —mide
# el rendimiento del POCUS transabdominal para confirmar el INTRAUTERINO,
# contra la ecografía transvaginal del obstetra—, así que su arista entra con
# `estado_lr: no_medido` y sus cifras viven en `notas_de_uso`, donde se leen sin
# que nadie las tome por cocientes de esta condición.

id: 'HM:6016'
tipo: condicion
clase: enfermedad
termino: Embarazo ectópico
termino_en: Ectopic pregnancy
url: "https://powersemiotics.com/medsemiotics/post.html?slug=embarazo-ectopico-precision-semiotica"
sinonimos: [gestación ectópica, embarazo extrauterino, embarazo tubárico]

codigos: {snomed: null, cie10: null}

# La fuente no publica prevalencia del ectópico en la población estudiada.
probabilidad_base: null
factores_riesgo: []

signos:
  # ─── ecografía transabdominal en urgencias: el primer contacto ──────────────
  - concepto: 'HM:3165'    # Embarazo intrauterino confirmado en ecografía
    rol: imagen
    estado_lr: no_medido
    efecto: excluye
    dispara_si: presente
    sostiene: mecanismo
    poblacion: >-
      143 gestantes sintomáticas del primer trimestre atendidas en urgencias por
      sangrado vaginal y dolor abdominopélvico
    ref: 'pmid:36063623'
    motivo: >-
      la exclusión no descansa en un cociente sino en la anatomía: un embarazo
      ectópico está fuera del útero por definición, así que ver el embarazo
      dentro lo vuelve muy improbable sin que nadie haya tenido que medirlo. Y
      la fuente no lo mide: su condición diana es el embarazo intrauterino
      contrastado contra la ecografía transvaginal del obstetra, no el ectópico
      contrastado contra visualización quirúrgica o seguimiento. Convertir su
      especificidad del 100% en un cociente del ectópico sería inventar un
      número que el estudio no calculó. Ver `notas_de_uso`.
    decision: >-
      cuando dice que sí, créele; cuando no lo ve, no has descartado nada. Es
      una asimetría, no un resultado positivo o negativo: sin intrauterino
      confirmado hay un embarazo de localización no determinada, que obliga a
      ecografía transvaginal y hCG, no a un alta
    advertencia: >-
      el embarazo heterotópico existe: confirmar el intrauterino no excluye un
      ectópico simultáneo, y la excepción pesa de verdad en la mujer que viene
      de reproducción asistida. El seudosaco es la otra trampa, y es la
      peligrosa: una colección endometrial central sin saco vitelino ni embrión
      NO es este hallazgo

  # ─── ecografía transvaginal: lo único que decide ────────────────────────────
  - concepto: 'HM:3064'    # Masa anexial sin gestación intrauterina en ecografía transvaginal
    rol: imagen
    estado_lr: medido
    poblacion: >-
      gestantes con dolor abdominal o sangrado vaginal en la gestación precoz
      (n = 6885)
    lr_positivo:
      valor: 111
      ic95: [12, 1028]
      ref: 'pmid:23613077'
    decision: >-
      el hallazgo que confirma. Con el útero vacío, una masa anexial mueve la
      probabilidad más que todo lo demás junto
    advertencia: >-
      el intervalo de confianza abarca de 12 a 1028. La dirección es
      inequívoca; la magnitud exacta, no. Tratar el 111 como un número fino es
      leer en la cifra una precisión que el estudio no tiene

  - concepto: 'HM:3065'    # Anomalía anexial en ecografía transvaginal
    rol: imagen
    estado_lr: medido
    poblacion: >-
      gestantes con dolor abdominal o sangrado vaginal en la gestación precoz
      (n = 6885)
    lr_negativo:
      valor: 0.12
      ic95: [0.03, 0.55]
      ref: 'pmid:23613077'
      nota: >-
        la fuente lo expresa como el valor de NO encontrar anomalías anexiales,
        que es el cociente negativo de este hallazgo
    decision: >-
      la exploración anexial normal es lo que más baja la probabilidad, y es la
      otra mitad de por qué la ecografía transvaginal manda aquí

  # ─── exploración bimanual ───────────────────────────────────────────────────
  - concepto: 'HM:3066'    # Dolor a la movilización cervical
    rol: prueba_especifica
    estado_lr: medido
    poblacion: >-
      gestantes con dolor abdominal o sangrado vaginal en la gestación precoz
      (n = 1435)
    lr_positivo:
      valor: 4.9
      ic95: [1.7, 14]
      ref: 'pmid:23613077'

  - concepto: 'HM:3067'    # Masa anexial en la exploración bimanual
    rol: apoyo
    estado_lr: medido
    poblacion: >-
      gestantes con dolor abdominal o sangrado vaginal en la gestación precoz
      (n = 1378)
    lr_positivo:
      valor: 2.4
      ic95: [1.6, 3.7]
      ref: 'pmid:23613077'
    decision: >-
      la misma masa vista en la ecografía vale 111 y palpada vale 2.4. No es
      incoherencia: son dos pruebas distintas sobre el mismo órgano

  - concepto: 'HM:3068'    # Dolor a la palpación anexial
    rol: apoyo
    estado_lr: medido
    poblacion: >-
      gestantes con dolor abdominal o sangrado vaginal en la gestación precoz
      (n = 1435)
    lr_positivo:
      valor: 1.9
      ic95: [1.0, 3.5]
      ref: 'pmid:23613077'
    advertencia: >-
      el extremo inferior del intervalo toca 1.0: compatible con no aportar nada

  # ─── motivos de consulta: definen la población, no la discriminan ───────────
  - concepto: 'HM:0201'    # Dolor abdominal
    rol: manifestacion
    estado_lr: no_medido
    ref: 'pmid:23613077'
    motivo: >-
      es criterio de entrada del estudio, así que dentro de esa población no hay
      contraste que medir. La fuente sí acota la anamnesis entera: ningún
      componente pasa de un LR+ de 1.5

  - concepto: 'HM:3069'    # Sangrado vaginal en la gestación precoz
    rol: manifestacion
    estado_lr: no_medido
    ref: 'pmid:23613077'
    motivo: >-
      el otro criterio de entrada, con la misma acotación: ningún componente de
      la anamnesis alcanza un LR+ de 1.5

  # ─── analítica cuantitativa: zonas discriminatorias en PUL ─────────────────
  - concepto: 'HM:3189'    # hCG sérica cuantitativa
    rol: prueba_especifica
    estado_lr: medido
    lr_positivo:
      valor: 2.30
      umbral: 'hCG > 1500 mIU/mL'
      ref: 'pmid:16308901'
    lr_negativo:
      valor: 0.91
      umbral: 'hCG > 1500 mIU/mL'
      ref: 'pmid:16308901'
    poblacion: >-
      527 mujeres con embarazo de localización no determinada (PUL) tras
      ecografía transvaginal en unidad especializada
    graduacion:
      parametro: hCG sérica
      unidad: mIU/mL
      lectura: acumulativo
      nota: 1 IU/L equivale numéricamente a 1 mIU/mL
    tramos:
      - umbral: 'hCG > 1000 mIU/mL'
        desde: 1000
        sensibilidad: 0.217
        especificidad: 0.873
        lr_positivo: 1.71
        lr_negativo: 0.90
        ref: 'pmid:16308901'
        nota: >-
          un valor superior a 1000 mIU/mL con útero vacío desplaza muy poco la
          probabilidad (LR+ 1.71); la mayoría de ectópicos cursan con valores
          inferiores
      - umbral: 'hCG > 1500 mIU/mL'
        desde: 1500
        sensibilidad: 0.152
        especificidad: 0.934
        lr_positivo: 2.30
        lr_negativo: 0.91
        ref: 'pmid:16308901'
        nota: >-
          umbral clásico de zona discriminatoria; especificidad del 93.4% pero
          sensibilidad muy pobre (15.2%), con LR+ de sólo 2.30
      - umbral: 'hCG > 2000 mIU/mL'
        desde: 2000
        sensibilidad: 0.109
        especificidad: 0.952
        lr_positivo: 2.27
        lr_negativo: 0.94
        ref: 'pmid:16308901'
        nota: >-
          elevar el corte a 2000 mIU/mL aumenta la especificidad al 95.2% pero
          reduce la sensibilidad al 10.9%, sin ganar potencia diagnóstica (LR+
          2.27)
    decision: >-
      ningún valor aislado de hCG por encima de la zona discriminatoria confirma
      el ectópico, y un valor por debajo nunca lo descarta (LR− 0.90-0.94). La
      zona discriminatoria define cuándo un embarazo intrauterino viable
      debería verse, no cuándo un embarazo es obligadamente ectópico
    advertencia: >-
      el uso aislado de la zona discriminatoria clásica (1500-2000 mIU/mL) para
      indicar metotrexato o legrado interrumpe gestaciones intrauterinas viables
      que tardan más en ser visibles. La guía ACOG y Connolly 2013
      (pmid:23262929) elevan el corte de visualización fiable al 99% a 3500 mIU/mL

notas_de_uso:
  - >-
    LAS CIFRAS DE pmid:36063623 NO SON COCIENTES DEL ECTÓPICO Y NO DEBEN LEERSE
    COMO TALES. Miden el rendimiento del POCUS transabdominal hecho por médicos
    de urgencias para CONFIRMAR UN EMBARAZO INTRAUTERINO, contrastado contra la
    ecografía transvaginal del obstetra, en 143 gestantes sintomáticas del
    primer trimestre: exactitud 93.0%, sensibilidad 89.0%, especificidad 100%.
    Añadir un transductor lineal de alta frecuencia las lleva a 97.9%, 96.7% y
    100%. La condición diana es el intrauterino, no el ectópico, y el patrón de
    referencia es otra prueba de imagen, no el desenlace: son dos razones
    independientes por las que estas cifras no se convierten en un LR de
    HM:6016.
  - >-
    ESTA FUENTE TIENE ERRATA PUBLICADA Y ESTÁ COTEJADA (Am J Emerg Med
    2025;88:277, pmid:39709283). Corrige una sola celda de la Tabla 2 —el
    recuento de falsos negativos para actividad cardiaca fetal, 8 y no 12— y
    sus autores declaran que resultados, análisis y conclusiones no se ven
    afectados. Ninguna de las cifras de arriba cambia. Lo que sí cambia: quien
    recalcule a mano un cociente desde la fila de actividad cardiaca fetal tiene
    que usar FN = 8.

pendiente:
  - >-
    El embarazo de localización no determinada no está en el índice como
    concepto propio, y es el hallazgo que de verdad decide el manejo en
    urgencias: no es «ausencia de HM:3165» sino una categoría con su propia
    ruta. Entrará cuando haya una fuente que lo mida, no antes.
  - >-
    La cinética de la hCG seriada no entra: requiere otra fuente con datos de
    ascenso porcentual a las 48 horas.

conclusion_de_la_fuente: >-
  La ecografía transvaginal es la mejor prueba diagnóstica aislada para evaluar
  a una mujer con sospecha de embarazo ectópico. La presencia de dolor abdominal
  o sangrado vaginal en la gestación precoz debe llevar a solicitar una
  ecografía transvaginal y una hCG sérica cuantitativa.

procedencia:
  fuente: >-
    Acuñada al seguir la veta de la serie Rational Clinical Examination (pmid:23613077).
    Tramos de zona discriminatoria de hCG incorporados de Condous 2005 (pmid:16308901)
    y Connolly 2013 (pmid:23262929).

