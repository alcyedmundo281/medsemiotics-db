id: 'HM:6034'
tipo: condicion
clase: enfermedad
termino: Cáncer de mama
termino_en: Breast cancer
sinonimos:
  - carcinoma mamario
  - neoplasia maligna de mama

codigos: {snomed: null, cie10: null}

signos:
  - concepto: 'HM:3142'    # Masa mamaria sospechosa
    rol: prueba_especifica
    estado_lr: medido
    sensibilidad: 0.54
    especificidad: 0.94
    lr_positivo:
      valor: 10.6
      ic95: [5.8, 19.2]
      ref: 'pmid:10517431'
    decision: el hallazgo de una masa dominante o nódulo sospechoso en el examen clínico eleva marcadamente la probabilidad (LR+ 10.6)

  - concepto: 'HM:3143'    # Examen clínico reglado normal
    rol: prueba_sensible
    estado_lr: medido
    lr_negativo:
      valor: 0.47
      ic95: [0.40, 0.56]
      ref: 'pmid:10517431'
    decision: una palpación normal reduce la probabilidad de forma modesta (LR- 0.47) pero no excluye la necesidad de mamografía de cribado

conclusion_de_la_fuente: >-
  La exploración clínica mamaria (CBE) reglada y minuciosa de al menos 3 minutos
  por mama es una herramienta diagnóstica complementaria relevante: un resultado
  positivo tiene un cociente de 10.6 (especificidad 94%), aunque un examen normal
  no descarta la enfermedad (LR- 0.47).

procedencia:
  fuente: Acuñada en la Oleada 1.5 a partir de la revisión sistemática RCE (pmid:10517431).
