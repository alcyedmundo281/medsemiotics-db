# Condición del índice. Los códigos HM: son permanentes.
# Las aristas nacen con estado_lr: no_medido — la relación existe aunque nadie
# haya publicado su cociente. No se inventa ningún LR.

id: 'HM:6002'
tipo: condicion
clase: sindrome
termino: Síndrome de intestino irritable
termino_en: Irritable bowel syndrome
url: "https://powersemiotics.com/medsemiotics/post.html?slug=sindrome-de-intestino-irritable-precision-semiotica"
sinonimos:
  - colon irritable
  - SII
  - intestino irritable

codigos:
  snomed: null
  cie10: null    # pendiente: se declara solo con verificación, no de memoria

probabilidad_base:
  valor: 0.57
  poblacion: >-
    adultos con síntomas gastrointestinales bajos estudiados antes de su
    investigación (10 estudios prospectivos, 2355 pacientes); prevalencia resumida
    de SII tras la investigación del tracto gastrointestinal bajo
  ref: 'pmid:18854541'
factores_riesgo: []

# Signos que lo manifiestan. Solo se enlazan conceptos existentes en el índice.
signos:
  - concepto: 'HM:0201'    # Dolor abdominal
    rol: manifestacion
    estado_lr: no_medido
    decision: >-
      su relación con la defecación y con los cambios del hábito intestinal es el
      núcleo de los criterios diagnósticos; por sí solo no cuantifica la probabilidad
    ref: 'pmid:27144627'
  - concepto: 'HM:0303'    # Diarrea
    rol: manifestacion
    estado_lr: no_medido
  - concepto: 'HM:0304'    # Estreñimiento
    rol: manifestacion
    estado_lr: no_medido

# Es un diagnóstico clínico por criterios, sin prueba confirmatoria: su valor
# depende de que NO haya signos de alarma. Los que siguen apuntan a otra cosa y
# obligan a estudiar antes de etiquetar.
#
# CURADOS contra PubMed el 20/08/2026. Cuatro entradas con solo «concepto» eran
# la forma que tiene el conocimiento sin curar: alguien supo que importaban y
# nunca registró por qué ni de dónde. De los cuatro solo se emiten DOS. Que dos
# no salgan es el resultado correcto de la regla, no un fallo de ella.
signos_de_alarma:
  - concepto: 'HM:0711'    # Anemia
    efecto: bandera_roja
    dispara_si: presente
    estado_lr: no_medido
    sostiene: consenso_con_afirmacion
    ref: 'pmid:20697190'
    nota: >-
      Park afirma que la anemia, pese a su sensibilidad pobre para enfermedad
      orgánica, ofrece muy buena especificidad. No publica cifras: ninguna
      sensibilidad, especificidad, OR ni cociente acompaña a esa frase, así que
      se queda en consenso_con_afirmacion y no sube a discriminacion_medida.
      Solo subiría si alguien lee el texto completo, que está en coreano y no
      tiene versión en PMC. Registrado para que el próximo no repita la búsqueda.

  - concepto: 'HM:0803'    # Pérdida de peso
    efecto: bandera_roja
    dispara_si: presente
    estado_lr: no_medido
    sostiene: consenso_con_afirmacion
    ref: 'pmid:20697190'
    nota: >-
      Misma afirmación de Park y mismas condiciones que la anemia: buena
      especificidad para enfermedad orgánica, sin cifras publicadas.

# ── NO se emiten, y aquí está por qué ────────────────────────────────────────
# Sin esta razón escrita, el próximo que pase las vuelve a añadir. Esa es la
# mitad del valor de haber curado.
no_emitidos:
  - concepto: 'HM:0101'    # Fiebre
    motivo: >-
      Solo la sostiene consenso_de_lista: aparece en enumeraciones de síntomas
      de alarma sin que ninguna reseña mida su poder discriminativo. Y una
      fiebre en un paciente con síntomas de intestino irritable no CONTRADICE
      el diagnóstico: simplemente no es de su territorio. Obliga a explicar la
      fiebre, no a abandonar la hipótesis. Declararla bandera roja afirmaría
      algo más fuerte de lo que consta.
    nota: >-
      No hace falta la bandera para que se vea: una fiebre validada que ningún
      signo del protocolo declara cae en el resto no simbolizado, baja el
      acoplamiento y aparece en la indagación.

  - concepto: 'HM:0310'    # Melena
    motivo: >-
      La evidencia disponible es de OTRO hallazgo. Hammer midió sangre en el
      papel higiénico, que es sangrado bajo; la melena es sangre digerida, de
      origen alto. Atribuirle ese dato daría una cita que resuelve y habla de
      otra cosa.
    nota: >-
      Por eso se acuñó HM:3060 «Hematoquecia», que es el concepto que Hammer sí
      midió. Su arista tampoco se emite: ver la discrepancia más abajo.

# ── Discrepancia entre fuentes, sin resolver ─────────────────────────────────
discrepancias:
  - concepto: 'HM:3060'    # Hematoquecia
    resumen: >-
      Las dos fuentes se contradicen sobre este mismo hallazgo.
    a_favor:
      ref: 'pmid:15082584'
      dice: >-
        Hammer 2004, regresión logística sobre 568 pacientes: la sangre en el
        papel higiénico discrimina enfermedad orgánica baja frente a intestino
        irritable, con OR 2.7 (IC95% 1.4-5.1), p=0.002.
    en_contra:
      ref: 'pmid:20697190'
      dice: >-
        Park 2010, revisión sistemática: las alarm features como el sangrado
        rectal aportan poco valor discriminativo.
    decision: >-
      No se emite la arista. Ante dos fuentes que se contradicen no se afirma un
      poder discriminativo, que es lo consistente con la parsimonia que ya dejó
      fuera a la fiebre. El hallazgo se recogerá igualmente como resto no
      simbolizado, así que no desaparece: solo no se le atribuye una fuerza que
      no consta.
    para_reabrirla: >-
      Habría que leer el texto completo de Hammer (PMC1774043 está disponible) y
      comprobar que su modelo y su población coinciden con los de esta
      condición. Si se emitiera, el OR va en campo aparte y NUNCA dentro de
      lr_positivo, con sus covariables leídas del texto completo —el modelo
      incluye edad de inicio, sexo y criterios de Manning—, porque sin esa lista
      un OR de regresión no significa nada.

pendiente:
  - >-
    Los criterios diagnósticos tienen cocientes medidos que este índice aún no
    estructura como reglas, porque sus componentes no existen como conceptos. En
    pacientes con síntomas gastrointestinales bajos (pmid:18854541): Manning, LR+ 2.9
    (IC95% 1.3-6.4) y LR− 0.29 (IC95% 0.12-0.71); Roma I, LR+ 4.8 (IC95% 3.6-6.5) y
    LR− 0.34 (IC95% 0.29-0.41); Kruis, LR+ 8.6 (IC95% 2.9-26.0) y LR− 0.26 (IC95%
    0.17-0.41). Roma III, en un metaanálisis posterior (pmid:26076071): LR+ 3.35
    (IC95% 2.97-3.79) y LR− 0.39 (IC95% 0.34-0.46). Roma IV no consta validado en
    estas fuentes. Modelarlos exige acuñar sus componentes (dolor aliviado por la
    defecación, heces más blandas o frecuentes al inicio del dolor, moco rectal,
    distensión, sensación de evacuación incompleta) y leer el texto completo.
  - >-
    Los síntomas individuales tienen LR+ de 1.2 a 2.1 y LR− de 0.29 a 0.88
    (pmid:18854541), pero el abstract no los atribuye uno a uno salvo en los
    extremos: el LR− 0.29 (IC95% 0.12-0.72) corresponde a la AUSENCIA de dolor
    abdominal BAJO, un hallazgo más estrecho que el dolor abdominal (HM:0201). No se
    asigna a HM:0201 para no atribuirle la cifra de otro hallazgo; requiere acuñar
    el concepto y leer el texto completo.

procedencia:
  fuente: >-
    Acuñada al publicarse gastroenterologia/sindrome-intestino-irritable.html en
    medsemiotics. No figura en el temario de partida.
