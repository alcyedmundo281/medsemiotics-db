name: Libro, EPUB y fuente LuaLaTeX

# Valida el índice y genera sus salidas derivadas —build/indice.epub,
# build/libro.pdf, build/quarto/libro.tex y el ZIP con la fuente LuaLaTeX
# autocontenida— cuando cambia main. Los binarios no viven en git: cada
# ejecución los publica como artifact descargable, y los releases además los
# reciben como assets.
#
# CONTRATO CON LOS GENERADORES
# Una sola fuente, un solo manuscrito. `scripts/qmd.py` proyecta el índice a un
# proyecto Quarto book en build/quarto/, y de ese árbol salen las tres
# ediciones:
#   · scripts/epub.py  --salida <ruta> [--motor quarto|pandoc]
#   · scripts/libro.py --salida <ruta>            (PDF, deja build/quarto/libro.tex)
#   · scripts/paquete_latex.py --salida <ruta>    (empaqueta build/quarto/)
#   · scripts/verificar_publicacion.py --verificar-derivados --epub <ruta>
#   · todos salen con código != 0 si algo falló, incluida su propia validación
# Ninguno modifica el índice: scripts/build.py sigue siendo la única autoridad
# de validación y corre primero.
#
# EL ORDEN DE LOS PASOS NO ES DECORATIVO
# Cada generador REESCRIBE build/quarto/ entero. `libro.py` va después del ePub
# porque es el que deja `libro.tex` dentro del proyecto, y el empaquetado y la
# verificación de derivados van al final porque leen ese `.tex`. Invertirlos no
# produce un fallo silencioso —ambos abortan si falta— pero sí un fallo evitable.

on:
  push:
    branches: [main]
    paths:
      - 'conceptos/**'
      - 'condiciones/**'
      - 'referencias/**'
      - 'assets/**'
      - 'CITATION.cff'
      - 'scripts/build.py'
      - 'scripts/banco.py'
      - 'scripts/qmd.py'
      - 'scripts/libro.py'
      - 'scripts/epub.py'
      - 'scripts/paquete_latex.py'
      - 'scripts/verificar_publicacion.py'
      - '.github/workflows/libro.yml'
  pull_request:
    paths:
      - 'conceptos/**'
      - 'condiciones/**'
      - 'referencias/**'
      - 'assets/**'
      - 'CITATION.cff'
      - 'scripts/build.py'
      - 'scripts/banco.py'
      - 'scripts/qmd.py'
      - 'scripts/libro.py'
      - 'scripts/epub.py'
      - 'scripts/paquete_latex.py'
      - 'scripts/verificar_publicacion.py'
      - '.github/workflows/libro.yml'
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para adjuntar el asset al release

concurrency:
  group: libro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libro:
    name: Validar y generar libro, EPUB y fuente LuaLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias de Python
        run: pip install pyyaml

      - name: Validar el índice
        # La única autoridad de validación. Los generadores de más abajo
        # confían en que esto ya pasó y no repiten sus reglas enteras.
        run: python scripts/build.py

      - name: Instalar dependencias del sistema
        # Quarto renderiza las tres ediciones; pandoc queda instalado a
        # propósito para poder ejercitar el motor de respaldo. LuaLaTeX compila
        # el PDF: `biber` y `texlive-bibtex-extra` ya NO hacen falta, porque el
        # .tex de Quarto no usa biblatex —la bibliografía se emite ya resuelta
        # y numerada en orden de aparición—.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc fonts-freefont-ttf default-jre-headless librsvg2-bin \
            texlive-latex-recommended texlive-latex-extra \
            texlive-lang-spanish texlive-luatex
          echo "pandoc: $(pandoc --version | head -1)"
          # rsvg-convert no es opcional: dos figuras del índice son SVG y LaTeX
          # no incluye SVG, así que Quarto las convierte con esta herramienta o
          # aborta el PDF. Rasteriza además la portada, que Kindle no admite en
          # SVG.
          echo "rsvg-convert: $(rsvg-convert --version)"
          echo "lualatex: $(lualatex --version | head -1)"

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Instalar epubcheck
        run: |
          VER=5.1.0
          curl -fsSL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${VER}/epubcheck-${VER}.zip"
          unzip -q /tmp/epubcheck.zip -d /opt
          echo "EPUBCHECK_JAR=/opt/epubcheck-${VER}/epubcheck.jar" >> "$GITHUB_ENV"

      - name: Generar el ePub
        run: python scripts/epub.py --salida build/indice.epub --motor quarto

      - name: Comprobar el motor de respaldo
        # El respaldo con pandoc lee `build/quarto/libro-plano.md`, que qmd.py
        # escribe concatenando LOS MISMOS capítulos. Si esta edición deja de
        # pasar la validación mientras la de Quarto la pasa, las dos han
        # divergido: es un fallo de qmd.py, no una variante aceptable. No se
        # publica: solo se comprueba.
        run: python scripts/epub.py --salida build/control-pandoc.epub --motor pandoc

      - name: Compilar el libro en PDF
        # Mismo proyecto Quarto que el ePub: el libro impreso y el electrónico
        # no pueden divergir. `keep-tex` deja build/quarto/libro.tex junto a las
        # imágenes ya copiadas, que es lo que empaqueta el ZIP.
        run: |
          python scripts/libro.py --salida build/libro.pdf
          test -s build/libro.pdf || { echo "::error::No se generó build/libro.pdf"; exit 1; }

      - name: Empaquetar la fuente LuaLaTeX autocontenida
        run: |
          python scripts/paquete_latex.py --salida build/medsemiotics-db-latex.zip
          test -s build/medsemiotics-db-latex.zip || { echo "::error::No se generó el ZIP LaTeX"; exit 1; }

      - name: Verificar coherencia de publicación
        # Va después del libro: comprueba build/quarto/libro.tex, que solo
        # existe una vez renderizado el PDF. Valida las URLs públicas de cada
        # condición y que cada figura declarada en `archivo_local` haya llegado
        # de verdad al LaTeX y al contenedor EPUB.
        run: python scripts/verificar_publicacion.py --verificar-derivados --epub build/indice.epub

      - name: Comprobar que el artefacto es real
        # Un ePub de pocos KB casi siempre significa "se generó vacío".
        run: |
          test -f build/indice.epub || { echo "::error::No se generó build/indice.epub"; exit 1; }
          BYTES=$(stat -c%s build/indice.epub)
          echo "Tamaño: $((BYTES / 1024)) KB"
          if [ "$BYTES" -lt 20480 ]; then
            echo "::error::build/indice.epub pesa $((BYTES / 1024)) KB: sospechosamente vacío."
            exit 1
          fi

      - name: Validar con epubcheck
        run: java -jar "$EPUBCHECK_JAR" build/indice.epub

      - name: Adjuntar al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          build/indice.epub build/quarto/libro.tex build/libro.pdf
          build/medsemiotics-db-latex.zip --clobber

      - name: Publicar derivados como artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: libro-epub-latex
          path: |
            build/indice.epub
            build/quarto/libro.tex
            build/libro.pdf
            build/medsemiotics-db-latex.zip
          retention-days: 90
